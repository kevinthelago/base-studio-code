[package]
name = "bsc-bluetooth"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "bsc bluetooth — DEFENSIVE Bluetooth intrusion analysis (#bluetooth). The RADIO-FREE brain: an Observation model (one BLE advertising-plane packet), a learned per-device baseline of NORMAL operation, and passive detectors for the two threats worth caring about — SPOOFING (address-twin, rssi-deviation, interval-anomaly, service-mismatch) and malicious/abusive signals (rogue active-scan, unwanted-tracker non-rotation). Everything that DECIDES is pure and needs no radio to test; capture (BlueZ) and the widget feed it later. Its Observation/Finding types are the wire contract the radio-analyzer widget renders."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_bluetooth"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
# Shared CLI scaffold: CmdDoc + help.
bsc-cli-util = { path = "../bsc-cli-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
