[package]
name = "bsc-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime-attestation store (SQLite) for base-studio-code — what ACTUALLY served each module while the app ran. The graph ships ~930 modules as records; this is the only place that can say whether a given record served, was declined and fell back to the platform module, or never ran at all."

# Tauri-free core lib + the `bsc runtime` subcommand, so the app (writer) and the umbrella binary
# (reader, and doctor's source) share one implementation. Mirrors bsc-request/plandb/errordb.
[lib]
name = "bsc_runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source (matches src-tauri) for cross-platform reliability.
rusqlite = { version = "0.40", features = ["bundled"] }
# Shared SQLite open + busy_timeout plumbing — the app writes while a session reads, so a CLI read
# must never race the app's flush.
bsc-sqlite-util = { path = "../bsc-sqlite-util", features = ["conn"] }
# Shared CLI scaffold: the CmdDoc help system + emit().
bsc-cli-util = { path = "../bsc-cli-util" }
