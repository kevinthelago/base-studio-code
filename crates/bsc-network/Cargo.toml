[package]
name = "bsc-network"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "User network store (SQLite store at ~/.base-studio-code/networks.db) for base-studio-code — a NETWORK is a domain that owns a set of projects and exactly one architect session. A thin network-specific shim over the shared bsc-json-store (#2158), reachable from the Tauri app's Glance tabs and the session-facing `bsc network` CLI. The ASSIGNMENT of a project to a network is not here — it is the `network` column on the project row in bsc-project, mirroring how `architect` already works."

# The core lib (no Tauri, no SQLite) so the tiny CLI reuses it without dragging the whole desktop app
# in. The hyphenated package name maps to the `bsc_network` crate name.
[build-dependencies]
# build.rs parses the committed graph store directly. NOT via bsc_graph: a build script must not depend
# on the crate graph it is part of, and load() reconciles the packaged seed into what it reads.
serde_json = "1"

[lib]
name = "bsc_network"

[dependencies]
# The shared verbatim-JSON-per-id store + CLI scaffold (#2158) — this crate supplies only the
# network-specific nouns + lean `list` fields via a CliSpec.
bsc-json-store = { path = "../bsc-json-store" }
# Shared CLI scaffold (#1762): `CmdDoc` for the per-command help catalog.
bsc-cli-util = { path = "../bsc-cli-util" }
# The ONE home-dir resolver (#1646), for the custom `new`/`rename` verbs.
bsc-util = { path = "../bsc-util" }
# `new`/`rename` compose and patch the stored row without a typed model.
serde_json = "1"
