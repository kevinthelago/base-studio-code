[package]
name = "bsc-blueprint"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "User blueprint store (SQLite store at ~/.base-studio-code/blueprints.db) for base-studio-code (#1719) — a thin blueprint-specific shim over the shared bsc-json-store (#2158), reachable from the Tauri app's blueprint commands and the session-facing `bsc blueprint` CLI."

# The core lib (no Tauri, no SQLite) so the tiny CLI reuses it without dragging the whole desktop app
# in. The hyphenated package name maps to the `bsc_blueprint` crate name.
[build-dependencies]
# build.rs parses the committed graph store directly. NOT via bsc_graph: a build script must not depend
# on the crate graph it is part of, and load() reconciles the packaged seed into what it reads.
serde_json = "1"

[lib]
name = "bsc_blueprint"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
# The shared verbatim-JSON-per-id store + CLI scaffold (#2158) — this crate supplies only the
# blueprint-specific nouns + lean `list` fields via a CliSpec.
bsc-json-store = { path = "../bsc-json-store" }
# Shared CLI scaffold (#1762): `CmdDoc` for the per-command help catalog.
bsc-cli-util = { path = "../bsc-cli-util" }
