[package]
name = "bsc-rf"
version = "0.1.0"
edition = "2021"
description = "`bsc rf` — DEFENSIVE RF monitoring: detect radio jamming and RF denial-of-service against 2.4/5 GHz WiFi from a commodity adapter. Reads the radio's own telemetry (nl80211 survey occupancy, monitor-mode radiotap frame statistics) and fuses several weak signals into a verdict that carries its evidence. Nothing here transmits — there is no injection, no deauth and no active probing path, and a test asserts it."

[lib]
name = "bsc_rf"

# The radio is plugged into the monitor Pi, so the tool must run THERE — and the
# unified `bsc` carries bundled DuckDB against a device with 1.1 GB free on its
# SD card. Same precedent as bsc-lan; tests/lean.rs keeps it honest.
[[bin]]
name = "bsc-rf"
path = "src/main.rs"

[dependencies]
# The shared CLI scaffold (#1762): CmdDoc help catalog + the emit/absent-marker conventions every
# other `bsc` noun renders through.
bsc-cli-util = { path = "../bsc-cli-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Proc-macro only: no runtime weight, and tests/lean.rs still pins the closure.
thiserror = "2"
