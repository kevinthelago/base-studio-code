[package]
name = "bsc-widget"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "`bsc widget` — a widget is a NODE: one toggleable UI surface, the stream it subscribes to, and the verb that turns it on or off."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_widget"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
bsc-cli-util = { path = "../bsc-cli-util" }
# The ONE channel for asking the running app to do something (#3274).
bsc-appchan = { path = "../bsc-appchan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
