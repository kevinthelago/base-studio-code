[package]
name = "bsc-say"
version = "0.1.0"
edition = "2021"
description = "`bsc say` — speak text aloud from any session: a provider trait with the OS speech service as the always-available floor and bundled Piper (neural, ONNX) as the default when it resolves."

[lib]
name = "bsc_say"

[dependencies]
bsc-cli-util = { path = "../bsc-cli-util" }
# Resolves ~/.base-studio-code, under which the piper voice dir lives. ONE precedence, shared with
# every other store, so the app and the CLI never disagree about where a voice was installed.
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
