[package]
name = "bsc-ui"
version = "0.1.0"
edition = "2021"
description = "The `bsc ui` CLI — the ONE UI-design-surface command (#2469): the spec-first SDK's KitNode contract (embedded from src-tauri/data/ui/kit-nodes.json, the ONE source of truth shared with the frontend SDK) + structural validator + theme registry (#1852), with the component-library store verbs (list/get/set/remove · kit · eslint-preset · usage, #2281) mounted from bsc-component."

# Tauri-free, SQLite-free: a tiny CLI over an embedded JSON contract. The hyphenated package name maps
# to the `bsc_ui` crate name.
[lib]
name = "bsc_ui"

[dependencies]
# Shared CLI scaffold (#1762): CmdDoc help catalog + help dispatch.
bsc-cli-util = { path = "../bsc-cli-util" }
# The component-library store CLI (#2281), mounted under `bsc ui` (#2469): list/get/set/remove +
# kit/eslint-preset/usage delegate to bsc_component::cli; its CmdDocs compose into the merged help.
bsc-component = { path = "../bsc-component" }
serde_json = "1"
