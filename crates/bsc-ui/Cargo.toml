[package]
name = "bsc-ui"
version = "0.1.0"
edition = "2021"
description = "The spec-first UI SDK's agent-facing face (#1852) — the KitNode contract (embedded from src-tauri/data/ui/kit-nodes.json, the ONE source of truth shared with the frontend SDK) plus a structural validator, exposed as the `bsc ui` CLI (schema · validate) so a live session can author + check UI-as-data from its own shell."

# Tauri-free, SQLite-free: a tiny CLI over an embedded JSON contract. The hyphenated package name maps
# to the `bsc_ui` crate name.
[lib]
name = "bsc_ui"

[dependencies]
# Shared CLI scaffold (#1762): CmdDoc help catalog + help dispatch.
bsc-cli-util = { path = "../bsc-cli-util" }
serde_json = "1"
