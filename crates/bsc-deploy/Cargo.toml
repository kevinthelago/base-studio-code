[package]
name = "bsc-deploy"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"

# `bsc-deploy` — ship a binary to a device, and be able to take it back.
#
# LEAN and standalone, like `bsc-app`: the shared CLI scaffold, JSON for the roster, and nothing
# else. No database and no HTTP client, so it stays out of both the DuckDB and the OpenSSL build
# paths — which is what a device build has to avoid, and what keeps `cargo check -p bsc-deploy`
# in seconds.
[dependencies]
bsc-cli-util = { path = "../bsc-cli-util" }
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"
