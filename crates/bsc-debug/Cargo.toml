[package]
name = "bsc-debug"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Inspect the RUNNING app's live DOM + preview state from a session (#3437) — the read-only third leg beside `bsc shot` (pixels) and `bsc navigate` (steering). Rides the shared bsc_appchan request channel."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_debug"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
# The shared bsc→app request channel (#3274) — the SAME one `shot` and `navigate` use, routed by KIND.
bsc-appchan = { path = "../bsc-appchan" }
# Shared CLI scaffold (#1762): the help catalog + the emit/output contract.
bsc-cli-util = { path = "../bsc-cli-util" }
# `now_ms` for the request id + stale sweep, as the sibling verb crates do.
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
