[package]
name = "bsc-json-store"
version = "0.1.0"
edition = "2021"
description = "Shared verbatim-JSON-per-id user file store + CLI scaffold (#2158) for base-studio-code. bsc-blueprint and bsc-persona were byte-identical stores (CRUD over ~/.base-studio-code/<segment>/<id>.json) with a byte-identical `bsc <noun>` CLI; this is their single home, so each is now a thin shim over one implementation and the copies can't drift."

# The core lib (no Tauri, no SQLite — just file CRUD + a small CLI dispatch) so the tiny wrapper
# crates reuse it without dragging the desktop app in. The hyphenated package name maps to the
# `bsc_json_store` crate name.
[lib]
name = "bsc_json_store"

[dependencies]
# Shared leaf utilities (#1646): the one cross-platform home-dir / `~/.base-studio-code` resolver, so
# every store CLI agrees on which dir it reads/writes.
bsc-util = { path = "../bsc-util" }
# Shared CLI helpers (#1621): `print_json` + `read_stdin_json` (the object-or-array stdin read the
# `set`-style command takes).
bsc-sqlite-util = { path = "../bsc-sqlite-util" }
# Shared CLI scaffold (#1762): `CmdDoc`/`handle_help`/`unknown_command` help system + `resolve_store_path`.
bsc-cli-util = { path = "../bsc-cli-util" }
serde_json = "1"
