[package]
name = "bsc-notify"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Push delivery for incidents — turns a coalesced bsc-incident Incident into a phone notification. ntfy first: a self-hosted push server, so a POST from here becomes a real OS notification on a phone whose app is closed, with no Apple/Google account and nothing leaving your own infrastructure. The Incident→message mapping is pure and tested; the POST sits behind a transport trait."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_notify"

# The mapping (Incident -> ntfy message) is PURE and needs no network. Only the real transport
# touches the wire, behind PushTransport, so the tests build the message and assert its shape
# against a recording fake — the network is never hit in a test.
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"
[dependencies]
bsc-incident = { path = "../bsc-incident" }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
serde_json = "1"
