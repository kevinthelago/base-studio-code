[package]
name = "bsc-files"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"

# `bsc-files` — the agent-facing filesystem/structure CLI (#1078 follow-up). A LEAN, standalone
# sidecar (like `bsc-project`): it depends only on the shared CLI scaffold + a gitignore-aware
# walker, NOT on Tauri, so it spawns cheaply per session AND runs on its own from any terminal.
[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_files"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
bsc-cli-util = { path = "../bsc-cli-util" }
# #82 — `read` resolves a missing path against the algorithms store before calling it absent, reusing
# the SAME lookup `bsc graph harvest` uses (#75) rather than restating it here. A retired module's file
# is deliberately gone, so the filesystem alone is the wrong thing to answer with.
bsc-graph = { path = "../bsc-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ripgrep's directory walker: respects .gitignore/.ignore + skips hidden/.git by default, follows no
# symlinks (avoids the node_modules junction hazard), and yields per-entry metadata for file sizes.
ignore = "0.4"
