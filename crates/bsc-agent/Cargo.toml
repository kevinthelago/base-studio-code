[package]
name = "bsc-agent"
version = "0.1.0"
edition = "2021"

# The model-agnostic agent runtime (epic #1078, P2). A LEAN binary — depends on the
# shared provider crate, NOT on src-tauri/tauri — so it spawns cheaply per session
# like bsc-plan.
[[bin]]
name = "bsc-agent"
path = "src/main.rs"

[dependencies]
llm = { path = "../llm", package = "bsc-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
