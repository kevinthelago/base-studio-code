[package]
name = "bsc-session"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "The `bsc session` CLI (#architect-starts-and-stops-system-sessions): start · stop · list the app-owned SYSTEM SESSIONS (designer, librarian, architect, sound-designer, integrator). The id is an ENUM resolved against a closed registry and refused outside it — that closed set is what makes the verb safe to grant to the architect, which ingests raw user prose. Tauri-free; rides the shared bsc-appchan transport."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_session"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bsc-util = { path = "../bsc-util" }
bsc-cli-util = { path = "../bsc-cli-util" }
# The ONE bsc→app request channel — shared with `bsc shot`/`bsc navigate`/`bsc fleet`, so there is no
# second transport.
bsc-appchan = { path = "../bsc-appchan" }
# `bsc session ask` opens a LOOP and `bsc session reply` posts into one
# (#an-ask-is-a-loop-again-and-every-turn-is-delivered). The dependency runs THIS WAY ONLY: making
# `bsc loop say` deliver would need bsc-loop to resolve a participant to a session and reach the app,
# which is the reverse edge and a cycle. Keeping both verbs here leaves `bsc loop` a generic
# conversation store that knows nothing about system sessions.
bsc-loop = { path = "../bsc-loop" }
bsc-sqlite-util = { path = "../bsc-sqlite-util" }
