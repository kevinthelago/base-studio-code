[package]
name = "bsc-cli-util"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Shared scaffold for the base-studio-code state CLIs (#1762) — the byte-identical `main` wrapper (`cli_main`), the flag→env→default store-path resolver (`resolve_store_path`), and the lean-vs-JSON output dispatch (`emit`). NOT SQLite-specific (bsc-data is DuckDB, bsc-project is fs), so it lives beside `bsc-sqlite-util` rather than inside it. The hyphenated package name maps to the `bsc_cli_util` crate name."

# Lib only — no binaries. The hyphenated package name maps to the `bsc_cli_util` crate name.
[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_cli_util"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The vendored-file provenance stamp (#4192) — ONE content-hash form shared by every `emit`
# surface, so `bsc ui emit` and `bsc graph emit` cannot drift into two look-alike contracts.
sha2 = "0.11"

[dev-dependencies]
# The MATERIALIZER, for its merged-store loader ONLY. The committed graph store is one file plus
# `graph/records/<id>.json` per record (`epic-retire-json-ledgers-for-db-and-git-drivers`), and the
# tree-wide source guard in this crate must see every record — a reader that parses the store file
# alone reports a shrunken population and passes over what is left. `graph_materialize` is what the
# BUILD reads, so going through it is what stops this guard and the compiler disagreeing about which
# records exist. Dev-only: not propagated to anything that links this crate.
graph-materialize = { path = "../graph-materialize" }
