[package]
name = "bsc-llm"
version = "0.1.0"
edition = "2021"

# Lib name `llm` so consumers keep using `llm::...` paths (the package is `bsc-llm`).
[lib]
name = "llm"

[dependencies]
# `blocking` is for the `bsc llm` CLI only: it is a synchronous command, and pulling tokio in as a
# real dependency (it is dev-only here) just to await two GETs would be the larger change.
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tolerant recovery of tool calls a local model emits as text (toolparse.rs).
regex = "1"
# Streaming the Ollama native /api/chat NDJSON response token-by-token to the PTY (#1832).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `bsc llm bench`: `now_ms()` for the per-run nonce, and the shared `emit` so --json/--pretty behave
# the way every other bsc surface does rather than growing a third convention here.
bsc-util = { path = "../bsc-util" }
bsc-cli-util = { path = "../bsc-cli-util" }

[dev-dependencies]
# Async runtime for the live-socket mock-HTTP integration tests (offline; #1744).
tokio = { version = "1", features = ["rt", "macros"] }
