[package]
name = "bsc-planfs"
version = "0.1.0"
edition = "2021"
description = "Projects the plan store as a read-only file tree, so an agent reads its plan with cat and ls instead of a CLI grammar (phase-3-store-surfaces-are-filesystems). The projection is PURE - store rows in, relative-path/content pairs out - so its tests run on any host; only materialize() touches a filesystem."

[lib]
name = "bsc_planfs"

# serde only. Deliberately no SQLite dependency: the projection consumes the JSON that
# `bsc plan get --json` already emits, so this crate never opens plan.db and never pulls the
# DuckDB-shaped part of the workspace into its build.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# examples only. launch.rs composes the projection with the sandbox launcher; the library
# itself stays free of that dependency.
[dev-dependencies]
bsc-sandbox = { path = "../bsc-sandbox" }
