[package]
name = "bsc-mcp"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "MCP server store (SQLite at ~/.base-studio-code/mcp.db) for base-studio-code — a thin MCP-specific shim over the shared bsc-json-store, plus the persona ASSIGNMENT verbs. A server reaches a session because a persona carries it; there is no project or per-pane scoping."

# No Tauri, no SQLite of its own: the tiny CLI reuses the shared store scaffold. The hyphenated
# package name maps to the `bsc_mcp` crate name.
[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_mcp"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
# The shared verbatim-JSON-per-id store + CLI scaffold — this crate supplies only the MCP-specific
# nouns, the lean `list` projection, and the assign/unassign verbs.
bsc-json-store = { path = "../bsc-json-store" }
# Shared CLI scaffold: `CmdDoc` for the per-command help catalog + store-path resolution.
bsc-cli-util = { path = "../bsc-cli-util" }
# `bsc_base_dir` — the one definition of ~/.base-studio-code.
bsc-util = { path = "../bsc-util" }
# Assignment is a read-modify-write of the PERSONA record, so this crate parses persona JSON.
serde_json = "1"
