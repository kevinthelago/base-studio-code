[package]
name = "bsc-shot"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Screenshot request protocol (#3261): the file-based request/response channel `bsc shot` uses to ask the RUNNING app for a webview snapshot, plus the `bsc shot` CLI. Tauri-free — the desktop app (the watcher/capturer) and the tiny CLI both depend on it."

# Tauri-free core so the lean `bsc` umbrella binary can reuse it without dragging the desktop app in
# (matches plandb/skilldb).
[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_shot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode a captured PNG to RGBA8 for `shot diff` — same version the app side uses (src-tauri).
png = "0.18"
# `bsc_base_dir()` (the ~/.base-studio-code root) + `now_ms()` — the same helpers every store crate uses.
bsc-util = { path = "../bsc-util" }
bsc-cli-util = { path = "../bsc-cli-util" }
# The ONE bsc→app request channel (#3274) — shared with `bsc navigate`, so there is no second transport.
bsc-appchan = { path = "../bsc-appchan" }
# The baseline SWEEP lands each component before capturing it (#a-baseline-sweep-walks-the-kit-itself).
# Reusing navigate's round-trip rather than re-sending its request shape — same channel, one caller more.
bsc-navigate = { path = "../bsc-navigate" }
# Reads the component store directly to enumerate a kit; the whole component CLI is not needed for a list.
bsc-json-store = { path = "../bsc-json-store" }

[dev-dependencies]
tempfile = "3"
