[package]
name = "bsc-lan-sense"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "`bsc lan` sensor-side observation: what the emit-only monitor Pi can see about itself. Its /proc parsing is pure text-to-verdict, so the security posture of a box nobody can log into is testable from fixtures."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_lan_sense"

[dependencies]
bsc-lan-stream = { path = "../bsc-lan-stream" }
# Reused for civil-date arithmetic; the EVE-specific normalisation is ours.
bsc-util = { path = "../bsc-util" }
# Tier 2 RF findings become wire events here; bsc-rf itself stays wire-free.
bsc-rf = { path = "../bsc-rf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Test-only: building a Sensor needs a signing key.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[lints.rust]
# NO UNSAFE, and it is FORBID rather than deny: this crate parses hostile-shaped text off the
# network into a verdict, so nothing in it has any business reaching for a raw pointer, and
# `forbid` cannot be lifted by an `#[allow]` further in. It lived as `#![forbid(unsafe_code)]` in
# `src/lib.rs` until that file stopped existing (`a-crate-root-is-shared-so-a-crate-is-one-file`):
# the crate root is SHARED by every adopter now, so a per-crate inner attribute has nowhere to sit
# and the manifest — a file that stays regardless — is where cargo has read this since 1.74.
unsafe_code = "forbid"

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
