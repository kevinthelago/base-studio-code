[package]
name = "bsc"
version = "0.1.0"
edition = "2021"
description = "The unified base-studio-code CLI (#1877): one binary, `bsc <command>` dispatching to every state store / tool that used to be its own `bsc-*` sidecar."

# Single binary named `bsc` — the one sidecar bundled into the app.
[[bin]]
name = "bsc"
path = "src/main.rs"

[features]
# `bsc data …` (the DuckDB canonical model) is on by default for the shipped app; a lean build can
# `--no-default-features` to drop DuckDB while keeping the SQLite/fs subcommands (#1877).
default = ["data"]
data = ["dep:bsc-data"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# The shared CLI scaffold (#1762): help dispatch + the unknown-command renderer.
bsc-cli-util = { path = "../bsc-cli-util" }
# The shared dangerous-command registry (#1844) + JSON parsing, for `bsc hook bash-deny` (#1916).
bsc-util = { path = "../bsc-util" }
serde_json = "1"
# Subcommand crates — each exposes `cli::run(args, prog)` (#1877).
bsc-project = { path = "../bsc-project" }
skilldb = { path = "../skilldb" }
compliance = { path = "../compliance" }
bsc-blueprint = { path = "../bsc-blueprint" }
bsc-persona = { path = "../bsc-persona" }
bsc-sound = { path = "../bsc-sound" }
bsc-teams = { path = "../bsc-teams" }
# `bsc studio` — the Studio store (#2890): shareable snapshots of the app's library state.
bsc-studio = { path = "../bsc-studio" }
bsc-component = { path = "../bsc-component" }
bsc-ui = { path = "../bsc-ui" }
logs = { path = "../logs" }
bsc-files = { path = "../bsc-files" }
# `bsc shot` — capture the running app's real pixels via a webview snapshot (#3261, epic #3260).
bsc-shot = { path = "../bsc-shot" }
# `bsc navigate` — steer the running app to a view so a capture can target it (#3274, epic #3260).
bsc-navigate = { path = "../bsc-navigate" }
bsc-fleet = { path = "../bsc-fleet" }
# Read-only inspection of the RUNNING app (#3437) — the third leg beside shot + navigate.
bsc-debug = { path = "../bsc-debug" }
# `bsc loop` — the conversation loop store: two participants exchange turns until a signal, or never (#3262, epic #3260).
bsc-loop = { path = "../bsc-loop" }
# `bsc request` — the improvement-request store: the designer→debug channel for bsc ui gaps (#3295, epic #3260).
bsc-request = { path = "../bsc-request" }
# `bsc graph` — the Algorithms knowledge graph (#2761): concepts + relationships, queryable read-only.
bsc-graph = { path = "../bsc-graph" }
# `bsc cad` — the Rust-native mesh/SDF geometry kernel (#3387, kernel #2621): mesh an op-tree spec to STL.
bsc-cad = { path = "../bsc-cad" }
plandb = { path = "../plandb" }
errordb = { path = "../errordb" }
# `bsc usage` — the per-project usage-events store (#3812, epic #3809): a running/generated app records
# usage events, an agent reads what users do. The dev-process analogue of errordb.
usagedb = { path = "../usagedb" }
# DuckDB-backed `bsc data` — optional so `--no-default-features` yields a lean binary (#1877).
bsc-data = { path = "../data", optional = true }
# `bsc mcp <server>` — the bundled native MCP servers, now subcommands of the umbrella (#1877). Each
# exposes a `mcp::Server::from_env()` run over the shared stdio JSON-RPC core (`mcp_rpc`).
research = { path = "../research" }
# `bsc mcp channel-mock` — the Marketer's mock marketing channel (#3146, epic #3145): records
# send_email/post/schedule calls instead of sending, so the outbound loop is testable with zero real sends.
channel = { path = "../channel" }
# `bsc cve` + `bsc mcp cve` — the OSV.dev vulnerability data layer (#3797, supply-chain #2433): scan a
# lockfile / check a package / advisory detail, the data layer the install-time `bsc-supply` hook builds on.
cve = { path = "../cve" }
mcp-rpc = { path = "../mcp-rpc" }
