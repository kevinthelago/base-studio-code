[package]
name = "bsc-config"
version = "0.1.0"
edition = "2021"
description = "`bsc config` (#168, request from the config-seed mirror #4251): read/adopt verbs for the desktop app's runtime config-seed mirror (~/.base-studio-code/config/). Before this, a file the app reported as DIVERGED from the packaged seed could be seen in the boot log but not acted on — the only remedy was deleting it by hand. Embeds its own copy of the CONFIG-ONLY subset of `src-tauri/data/` (same exclude list as the app's own embed) so this Tauri-free CLI can classify and diff against the packaged bytes without depending on the app crate."

[lib]
name = "bsc_config"

[dependencies]
bsc-util = { path = "../bsc-util" }
bsc-cli-util = { path = "../bsc-cli-util" }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
