[package]
name = "bsc-sandbox"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Renders an agent's isolation spec into an exec-ready argv: a systemd-run cgroup scope wrapping a bubblewrap namespace. Replaces the WSL2 subsystem in src-tauri/src/session/sandbox (phase-2-kernel-isolation-replaces-the-hook-floor). Tauri-free, and the RENDER is platform-independent so its tests run everywhere - only execution is Linux-gated. Also owns `bsc sandbox replay` (#135): a launch's rendered argv is persisted alongside the pane's other per-session state so it can be inspected or replayed outside the app."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_sandbox"

# The RENDER itself stays string-building over std — that half is what keeps this crate out of the
# DuckDB-shaped part of the workspace (see CLAUDE.md on which crates pay for that) and keeps
# `cargo check -p bsc-sandbox` a couple of seconds rather than a couple of minutes. `cli` pulls in
# the two leaf crates every `bsc-*` CLI already pays for.
[dependencies]
bsc-cli-util = { path = "../bsc-cli-util" }
bsc-util = { path = "../bsc-util" }

[dev-dependencies]
tempfile = "3"
