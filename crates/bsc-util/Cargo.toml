[package]
name = "bsc-util"
version = "0.1.0"
edition = "2021"
description = "Tiny dependency-free leaf crate for base-studio-code (#1646) — the ONE definition of home-dir resolution, the `~/.base-studio-code` base dir, epoch clocks (secs/ms), and the epoch-ms↔ISO-8601 civil-date pair. Shared by the desktop app and every `bsc-*` CLI so they all resolve the same on-disk store."

# Leaf crate: std only, no dependencies, so any CLI can pull it in for free.
[lib]
name = "bsc_util"

# TESTS ONLY — a dev-dependency is not propagated to anything that links this crate, so the
# "no dependencies" property above is unchanged for every consumer. `pane_id` is proved against
# `src/app/console/paneIdentity.fixtures.json`, a fixture GENERATED from the TypeScript it was ported
# from, and hand-rolling a JSON reader to avoid this line would reintroduce exactly the kind of
# second parser the port exists to remove.
[dev-dependencies]
serde_json = "1"
