[package]
name = "bsc-graph-layout"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "Layered-DAG graph layout for base-studio-code — Kahn longest-path layering, barycenter ordering, binary positions. Index-based and O(V+E), sized for a million nodes."

# Leaf crate: std only. Deliberately dependency-free so `cargo check -p bsc-graph-layout` never pulls
# DuckDB or arrow into the iteration loop — see CLAUDE.md on which crates pay that cost.
[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_graph_layout"
path = "../graph-materialize/crate_root.rs"

[dependencies]
