[package]
name = "bsc-mem"
version = "0.1.0"
edition = "2021"
description = "The MEMORY surface (`bsc mem`) — app heap and build cost, the counterpart to `bsc perf`."

[lib]
name = "bsc_mem"

[dependencies]
# The shared CLI scaffold: CmdDoc help, emit(), resolve_store_path.
bsc-cli-util = { path = "../bsc-cli-util" }
# The `runs` rows this surface READS. `bsc errors run` is the only writer — see that crate's `run`
# module for why cost is recorded there rather than in a store of this crate's own.
errordb = { path = "../errordb" }
# `growth` DELEGATES to the perf.db RSS reader rather than restating it: two implementations of one
# slope is exactly the duplication `the-preview-resolver-is-written-twice` is an open item about.
logs = { path = "../logs" }
# The ONE home-dir resolver (#1646) — a hub path derived the same way every other store derives it.
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
