[package]
name = "bsc-work"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"
description = "The WORK loop (`bsc work`) — the seam between a branch's git state and its plan record. Slice one: the gate records its own evidence instead of a session retyping it."

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
name = "bsc_work"
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"

[dependencies]
# The shared CLI scaffold: CmdDoc help + emit().
bsc-cli-util = { path = "../bsc-cli-util" }
# The change record this writes gate evidence onto, and the known-red declarations it reads.
# SQLite only — plandb takes bsc-data with default-features off, so this does not drag DuckDB in.
plandb = { path = "../plandb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
