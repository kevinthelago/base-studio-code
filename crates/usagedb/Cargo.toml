[package]
name = "usagedb"
version = "0.1.0"
edition = "2021"
description = "Per-app usage-events store (SQLite) for base-studio-code (#3812, epic #3809) — the per-project sink a running/generated app records usage events to, and `bsc usage` reads, so an agent can query what users do. The dev-process analogue of crates/errordb (`bsc errors`)."

# Tauri-free core lib + the `bsc usage` subcommand, so the umbrella binary and the desktop app both
# reuse it without relinking the whole app (mirrors errordb/plandb/skilldb).
[lib]
name = "usagedb"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source (matches src-tauri) for cross-platform reliability.
rusqlite = { version = "0.40", features = ["bundled"] }
# Shared SQLite open + busy_timeout plumbing (the `conn` feature) — so a CLI write never races the app.
bsc-sqlite-util = { path = "../bsc-sqlite-util", features = ["conn"] }
# Shared CLI scaffold: cli_main + resolve_store_path (--db→env→default) + the CmdDoc help system.
bsc-cli-util = { path = "../bsc-cli-util" }
