[package]
name = "bsc-capability"
version = "0.1.0"
edition = "2021"
build = "../graph-materialize/build.rs"

# `bsc-capability` — the USE layer's data: what a network can DO right now.
#
# LEAN and pure, like `bsc-app` and `bsc-deploy`. No database, no HTTP client, no Tauri — the
# aggregation reads are injected, so the rules are testable without four machines and a running app.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bsc-cli-util = { path = "../bsc-cli-util" }

[build-dependencies]
# build.rs parses the committed graph store directly — see crates/graph-materialize/build.rs.
serde_json = "1"

[lib]
# THE SHARED CRATE ROOT — this crate owns no source file at all. See
# crates/graph-materialize/crate_root.rs; the crate's own docs come from its record.
path = "../graph-materialize/crate_root.rs"
