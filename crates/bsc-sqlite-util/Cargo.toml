[package]
name = "bsc-sqlite-util"
version = "0.1.0"
edition = "2021"
description = "Shared helpers for the base-studio-code SQLite CLI+lib trio (plandb/skilldb/logs and their bsc-* binaries) — JSON value-list (de)serialization, home-dir resolution, JSON printing, and object-or-array stdin reads (#1621)."

# Lib only — no binaries. The hyphenated package name maps to the `bsc_sqlite_util` crate name.
[lib]
name = "bsc_sqlite_util"

[dependencies]
# Shared leaf utilities (#1646): the single source of truth for `home_dir` (re-exported below).
bsc-util = { path = "../bsc-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
