<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>base-studio-code · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin:0; height:100%; background:#1a1a1c; }
  body { font-family:"Inter", -apple-system, system-ui, sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="pane.jsx"></script>
<script type="text/babel" src="screen-console.jsx"></script>
<script type="text/babel" src="screen-knowledge.jsx"></script>
<script type="text/babel" src="screen-github.jsx"></script>
<script type="text/babel" src="screen-automations.jsx"></script>
<script type="text/babel" src="screen-settings.jsx"></script>

<script type="text/babel">
const Canvas = (
  <DesignCanvas>
    <DCSection id="console" title="01 · Console"
      subtitle="The main workspace. 3×3 grid of multi-view panes; one shows the hamburger menu open.">
      <DCArtboard id="console-default" label="Console · grid of mixed views"          width={1280} height={820}>
        <ScreenConsole menuPaneIdx={-1}/>
      </DCArtboard>
      <DCArtboard id="console-menu"    label="Console · hamburger menu open (top-left)" width={1280} height={820}>
        <ScreenConsole menuPaneIdx={0}/>
      </DCArtboard>
    </DCSection>

    <DCSection id="knowledge" title="02 · Knowledge Store"
      subtitle="Tag rail · block list · markdown editor with backlinks.">
      <DCArtboard id="knowledge" label="Knowledge Store" width={1280} height={820}>
        <ScreenKnowledgeStore/>
      </DCArtboard>
    </DCSection>

    <DCSection id="github" title="03 · GitHub"
      subtitle="Repository viewer with page-level tabs for Overview, Actions, and Hooks.">
      <DCArtboard id="gh-empty"    label="GitHub · empty / not connected" width={1280} height={820}>
        <ScreenGitHubEmpty/>
      </DCArtboard>
      <DCArtboard id="gh-overview" label="GitHub · Overview (branches · PRs · commits)" width={1280} height={960}>
        <ScreenGitHubOverview/>
      </DCArtboard>
      <DCArtboard id="gh-actions"  label="GitHub · Actions (workflows editor + runs)"  width={1280} height={1060}>
        <ScreenGitHubActions/>
      </DCArtboard>
      <DCArtboard id="gh-hooks"    label="GitHub · Hooks (pre-commit, pre-push, …)"     width={1280} height={920}>
        <ScreenGitHubHooks/>
      </DCArtboard>
    </DCSection>

    <DCSection id="automation" title="04 · Automations"
      subtitle="Schedule the app to run a premade command or load a knowledge article into a specified console.">
      <DCArtboard id="auto-schedules" label="Automations · Schedules (list + editor + history)" width={1280} height={1040}>
        <ScreenAutomationSchedules/>
      </DCArtboard>
      <DCArtboard id="auto-commands"  label="Automations · Commands library"                  width={1280} height={920}>
        <ScreenAutomationCommands/>
      </DCArtboard>
    </DCSection>

    <DCSection id="settings" title="05 · Settings"
      subtitle="Integrations keeps just Anthropic Claude + tools.">
      <DCArtboard id="set-gh"  label="Settings · GitHub"        width={1280} height={820}>
        <ScreenSettingsGitHub/>
      </DCArtboard>
      <DCArtboard id="set-int" label="Settings · Integrations"  width={1280} height={820}>
        <ScreenSettingsIntegrations/>
      </DCArtboard>
    </DCSection>

    <DCPostIt top={36} left={36} rotate={-3} width={230}>
      v2.1 — Automations back. GitHub page
      gets sub-tabs (Overview · Actions · Hooks)
      so you can edit workflow yaml and git
      hooks inline. Automations now mean:
      cron → run command or load knowledge
      block in a specified console.
    </DCPostIt>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(Canvas);
</script>
</body>
</html>
