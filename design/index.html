<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>base-studio-code · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin:0; height:100%; background:#1a1a1c; }
  body { font-family:"Inter", -apple-system, system-ui, sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="pane.jsx"></script>
<script type="text/babel" src="screen-console.jsx"></script>
<script type="text/babel" src="screen-projects-summary.jsx"></script>
<script type="text/babel" src="screen-projects.jsx"></script>
<script type="text/babel" src="screen-knowledge.jsx"></script>
<script type="text/babel" src="screen-github-summary.jsx"></script>
<script type="text/babel" src="screen-github.jsx"></script>
<script type="text/babel" src="screen-automations.jsx"></script>
<script type="text/babel" src="screen-claude-settings.jsx"></script>
<script type="text/babel" src="screen-settings.jsx"></script>

<script type="text/babel">
const Canvas = (
  <DesignCanvas>
    <DCSection id="console" title="01 · Console"
      subtitle="The main workspace. 3×3 grid of multi-view panes; one shows the hamburger menu open.">
      <DCArtboard id="console-default" label="Console · grid of mixed views"          width={1280} height={820}>
        <ScreenConsole menuPaneIdx={-1}/>
      </DCArtboard>
      <DCArtboard id="console-menu"    label="Console · hamburger menu open (top-left)" width={1280} height={820}>
        <ScreenConsole menuPaneIdx={0}/>
      </DCArtboard>
    </DCSection>

    <DCSection id="projects" title="02 · Project planning"
      subtitle="Lands on a portfolio Summary. Drill into any project for the Kanban board, roadmap, issues, planning session, and Claude tab.">
      <DCArtboard id="projects-summary" label="Summary · portfolio analytics (landing)"   width={1280} height={1500}>
        <ScreenProjectsSummary/>
      </DCArtboard>
      <DCArtboard id="projects-gated"   label="Gated · github not connected"            width={1280} height={820}>
        <ScreenProjectsGated/>
      </DCArtboard>
      <DCArtboard id="projects-list"    label="Projects · list of GH Projects"           width={1280} height={920}>
        <ScreenProjectsList/>
      </DCArtboard>
      <DCArtboard id="projects-board"   label="Board · kanban (5 columns, full cards)"   width={1440} height={920}>
        <ScreenProjectBoard/>
      </DCArtboard>
      <DCArtboard id="projects-drawer"  label="Issue drawer · AI subtask breakdown"      width={1440} height={920}>
        <ScreenIssueDrawer/>
      </DCArtboard>
      <DCArtboard id="projects-roadmap" label="Roadmap · milestones + burn-down"          width={1440} height={920}>
        <ScreenProjectRoadmap/>
      </DCArtboard>
      <DCArtboard id="projects-active"  label="Planning session · publishes to GitHub"   width={1320} height={920}>
        <ScreenProjectPlanning/>
      </DCArtboard>
    </DCSection>

    <DCSection id="knowledge" title="03 · Knowledge Store"
      subtitle="Tag rail · block list · markdown editor with backlinks.">
      <DCArtboard id="knowledge" label="Knowledge Store" width={1280} height={820}>
        <ScreenKnowledgeStore/>
      </DCArtboard>
    </DCSection>

    <DCSection id="github" title="04 · GitHub"
      subtitle="Lands on an org-wide Summary. Drill into Repositories for per-repo Overview / Actions / Hooks.">
      <DCArtboard id="gh-summary"  label="Summary · org-wide analytics (landing)"      width={1280} height={1340}>
        <ScreenGitHubSummary/>
      </DCArtboard>
      <DCArtboard id="gh-empty"    label="GitHub · empty / not connected" width={1280} height={820}>
        <ScreenGitHubEmpty/>
      </DCArtboard>
      <DCArtboard id="gh-overview" label="Repositories · single repo Overview"          width={1280} height={1000}>
        <ScreenGitHubOverview/>
      </DCArtboard>
      <DCArtboard id="gh-actions"  label="Repositories · Actions (workflows + runs)"   width={1280} height={1100}>
        <ScreenGitHubActions/>
      </DCArtboard>
      <DCArtboard id="gh-hooks"    label="Repositories · Hooks (pre-commit, pre-push)" width={1280} height={960}>
        <ScreenGitHubHooks/>
      </DCArtboard>
    </DCSection>

    <DCSection id="automation" title="05 · Automations"
      subtitle="Schedule the app to run a premade command or load a knowledge article into a specified console.">
      <DCArtboard id="auto-schedules" label="Automations · Schedules (list + editor + history)" width={1280} height={1040}>
        <ScreenAutomationSchedules/>
      </DCArtboard>
      <DCArtboard id="auto-commands"  label="Automations · Commands library"                  width={1280} height={920}>
        <ScreenAutomationCommands/>
      </DCArtboard>
    </DCSection>

    <DCSection id="settings" title="06 · Settings"
      subtitle="Integrations keeps just Anthropic Claude + tools.">
      <DCArtboard id="set-gh"  label="Settings · GitHub"        width={1280} height={820}>
        <ScreenSettingsGitHub/>
      </DCArtboard>
      <DCArtboard id="set-int" label="Settings · Integrations"  width={1280} height={820}>
        <ScreenSettingsIntegrations/>
      </DCArtboard>
    </DCSection>

    <DCSection id="claude" title="07 · Claude · scope hierarchy"
      subtitle="Global → Project → Console → Pane. Each layer adds to the parent, never subtracts.">
      <DCArtboard id="claude-settings"  label="Settings · Claude (global defaults + pinned knowledge)" width={1280} height={1500}>
        <ScreenSettingsClaude/>
      </DCArtboard>
      <DCArtboard id="claude-project"   label="Project · Claude tab (per-project overrides)"           width={1280} height={1180}>
        <ScreenProjectClaude/>
      </DCArtboard>
      <DCArtboard id="claude-console"   label="Console · project chip + pane context popover"          width={1280} height={860}>
        <ScreenConsoleClaudeContext/>
      </DCArtboard>
    </DCSection>

    <DCPostIt top={36} left={36} rotate={-3} width={250}>
      Projects and GitHub now LAND on
      Summary — portfolio + org-wide
      analytics. Drill into Projects or
      Repositories from the tab strip at
      the top.
    </DCPostIt>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(Canvas);
</script>
</body>
</html>
