<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Pane — Explorations</title>
<link rel="stylesheet" href="studio.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  /* dark scrollbars never appear inside panes (canvas hides them) */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/bs-ui.jsx"></script>
<script type="text/babel" src="components/markdown.jsx"></script>
<script type="text/babel" src="components/permissions.jsx"></script>
<script type="text/babel" src="components/github.jsx"></script>

<script type="text/babel">
const { useState } = React;

// Dark panel artboard frame styling
const PANEL = { background: 'var(--bg-1)', border: '1px solid var(--border)', borderRadius: 14,
  boxShadow: '0 1px 2px rgba(0,0,0,.18), 0 18px 50px rgba(20,16,12,.16)' };

function Brief() {
  const Swatch = ({ c, name }) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <span style={{ width: 22, height: 22, borderRadius: 6, background: c, border: '1px solid rgba(255,255,255,.1)' }} />
      <span style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--tx-mid)' }}>{name}</span>
    </div>
  );
  return (
    <div className="pane" style={{ padding: '24px 26px', justifyContent: 'flex-start', gap: 0 }}>
      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 500 }}>base-studio-code · planning page</div>
      <div style={{ fontSize: 24, fontWeight: 600, color: 'var(--tx-hi)', letterSpacing: '-.02em', marginTop: 8 }}>Project pane — exploration set</div>
      <div style={{ fontSize: 13.5, color: 'var(--tx-mid)', lineHeight: 1.6, marginTop: 10, maxWidth: 620, textWrap: 'pretty' }}>
        The pane sits beside the Claude session and is split into three stacked concerns. I drafted <b style={{ color: 'var(--tx-hi)' }}>three varieties of each</b> so you can mix and match — drag to reorder, click any card to focus it, or delete the ones you don't want.
      </div>
      <div style={{ display: 'flex', gap: 40, marginTop: 22, flexWrap: 'wrap' }}>
        <div>
          <div className="sec-eyebrow" style={{ marginBottom: 10 }}>The three sections</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {[['file', '1 · Project markdown files', 'Context the agent reads from'],
              ['shield', '2 · Agent permissions', 'What the agent may do'],
              ['github', '3 · GitHub structure', 'The repo it operates on']].map(([ic, t, d]) => (
              <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ width: 26, height: 26, borderRadius: 7, background: 'var(--bg-3)', display: 'grid', placeItems: 'center' }}><Icon name={ic} size={14} color="var(--accent)" /></span>
                <span>
                  <span style={{ display: 'block', fontSize: 12.5, fontWeight: 600, color: 'var(--tx-hi)' }}>{t}</span>
                  <span style={{ display: 'block', fontSize: 11, color: 'var(--tx-lo)' }}>{d}</span>
                </span>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="sec-eyebrow" style={{ marginBottom: 10 }}>Visual system</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
            <Swatch c="#15151a" name="surface · graphite" />
            <Swatch c="#d97757" name="accent · coral" />
            <Swatch c="#69bd89" name="allow · green" />
            <Swatch c="#d97070" name="deny · red" />
          </div>
          <div style={{ marginTop: 14, fontSize: 11.5, color: 'var(--tx-lo)', lineHeight: 1.5 }}>
            IBM Plex Sans for UI<br />IBM Plex Mono for paths & counts
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="brief" title="Overview" subtitle="Assumptions, system, and how to read this set">
        <DCArtboard id="brief" label="Read me first" width={720} height={400} style={PANEL}><Brief /></DCArtboard>
      </DCSection>

      <DCSection id="markdown" title="1 · Project markdown files" subtitle="The context documents the agent reads from">
        <DCArtboard id="md-a" label="A · Dense list" width={400} height={336} style={PANEL}><MarkdownA /></DCArtboard>
        <DCArtboard id="md-b" label="B · Context cards" width={400} height={540} style={PANEL}><MarkdownB /></DCArtboard>
        <DCArtboard id="md-c" label="C · Pinned + inline preview" width={400} height={486} style={PANEL}><MarkdownC /></DCArtboard>
      </DCSection>

      <DCSection id="permissions" title="2 · Agent permissions" subtitle="What the agent is allowed to do in this project">
        <DCArtboard id="pm-a" label="A · Preset modes" width={400} height={538} style={PANEL}><PermissionsA /></DCArtboard>
        <DCArtboard id="pm-b" label="B · Granular + risk" width={400} height={430} style={PANEL}><PermissionsB /></DCArtboard>
        <DCArtboard id="pm-c" label="C · Allow / Ask / Deny" width={400} height={420} style={PANEL}><PermissionsC /></DCArtboard>
      </DCSection>

      <DCSection id="github" title="3 · GitHub structure" subtitle="The repository the agent operates on">
        <DCArtboard id="gh-a" label="A · Repo + file tree" width={400} height={434} style={PANEL}><GithubA /></DCArtboard>
        <DCArtboard id="gh-b" label="B · Status + change badges" width={400} height={500} style={PANEL}><GithubB /></DCArtboard>
        <DCArtboard id="gh-c" label="C · Scoped access" width={400} height={438} style={PANEL}><GithubC /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
