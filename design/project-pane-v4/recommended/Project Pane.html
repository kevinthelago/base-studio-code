<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Project pane · recommended composition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="pp.css"/>
<style>
  html, body { margin:0; height:100%; background:var(--bg-canvas); overflow:hidden; }
  body { font-family:"Inter", -apple-system, system-ui, sans-serif; }
  #root { height:100vh; }
  .planning { display:flex; height:100vh; background:var(--bg-canvas); }
  .pane-dock { flex:0 0 400px; border-left:1px solid var(--border); min-width:0; }
  /* left side: a quiet placeholder for the planning chat so the pane reads in context */
  .chat { flex:1; min-width:0; display:flex; flex-direction:column; }
  .chat-top {
    height:44px; flex:0 0 44px; display:flex; align-items:center; gap:10px;
    padding:0 18px; border-bottom:1px solid var(--border-soft); background:var(--bg-panel);
    font-family:var(--mono); font-size:12px; color:var(--fg-muted);
  }
  .chat-body { flex:1; min-height:0; padding:28px 32px; display:flex; flex-direction:column; gap:16px; overflow:auto; }
  .chat-empty {
    margin:auto; max-width:440px; text-align:center; color:var(--fg-dim);
    font-family:var(--mono); font-size:12px; line-height:1.7;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="pp-data.jsx"></script>
<script type="text/babel" src="pp-agents.jsx"></script>
<script type="text/babel" src="pp-repo.jsx"></script>
<script type="text/babel" src="pp-github.jsx"></script>
<script type="text/babel" src="pp-context.jsx"></script>
<script type="text/babel" src="pp-merged.jsx"></script>
<script type="text/babel" src="pp-assembled.jsx"></script>

<script type="text/babel">
const { AssembledPane } = window;

// A deliberately-quiet placeholder for the planning chat, so the recommended
// pane is shown where it actually lives — docked right of the Claude session.
function PlanningChatPlaceholder() {
  return (
    <div className="chat">
      <div className="chat-top">
        <span style={{color:"var(--accent)"}}>▸ planning chat</span>
        <span style={{color:"var(--fg-dim)"}}>·</span>
        <span>@planner · sonnet-4.5</span>
        <span style={{flex:1}}/>
        <span style={{color:"var(--fg-dim)", fontSize:10.5}}>question 6 of ~12</span>
      </div>
      <div className="chat-body">
        <div className="placeholder" style={{height:"100%", borderRadius:10}}>
          planning conversation · not part of this deliverable
        </div>
      </div>
    </div>
  );
}

function RecommendedComposition() {
  return (
    <div className="planning">
      <PlanningChatPlaceholder/>
      <div className="pane-dock">
        <AssembledPane/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RecommendedComposition/>);
</script>
</body>
</html>
