<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; padding:13px 16px 13px 18px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; cursor:pointer; background:var(--bg-panel); border-top:{{ p.sep }}; border-left:2px solid transparent;" style-hover="background:var(--bg-elev); border-left-color:var(--accent);">
  <div style="min-width:0;">
    <div style="display:flex; align-items:center; gap:9px; margin-bottom:5px; flex-wrap:wrap;">
      <span style="width:7px; height:7px; border-radius:99px; background:{{ p.dotColor }}; flex-shrink:0;"></span>
      <span style="font-family:var(--mono); font-size:10px; color:var(--fg-dim);">{{ p.numStr }}</span>
      <span style="font-family:var(--sans); font-size:14px; font-weight:600; color:var(--fg);">{{ p.title }}</span>
      <span style="padding:1px 7px; border-radius:99px; font-family:var(--mono); font-size:9.5px; color:{{ p.statusColor }}; background:{{ p.statusBg }}; border:1px solid {{ p.statusBorder }};">{{ p.statusLabel }}</span>
      <sc-for list="{{ p.repos }}" as="r" hint-placeholder-count="2">
        <span style="padding:1px 7px; border-radius:99px; font-family:var(--mono); font-size:9.5px; background:var(--bg-elev2); color:var(--fg-muted); border:1px solid var(--border-soft);">{{ r }}</span>
      </sc-for>
      <sc-if value="{{ p.hasMore }}" hint-placeholder-val="{{ false }}">
        <span style="padding:1px 7px; border-radius:99px; font-family:var(--mono); font-size:9.5px; background:var(--bg-elev2); color:var(--fg-muted); border:1px solid var(--border-soft);">{{ p.repoMore }}</span>
      </sc-if>
    </div>
    <div style="color:var(--fg-muted); font-size:12px; line-height:1.5; margin-bottom:9px; max-width:600px;">{{ p.desc }}</div>
    <div style="display:flex; gap:16px; align-items:center; font-family:var(--mono); font-size:10.5px; color:var(--fg-muted); flex-wrap:wrap;">
      <sc-if value="{{ p.showItems }}" hint-placeholder-val="{{ true }}"><span><b style="color:var(--fg); font-weight:600;">{{ p.itemsCount }}</b> items</span></sc-if>
      <sc-if value="{{ p.showOpen }}" hint-placeholder-val="{{ true }}"><span><b style="color:var(--fg); font-weight:600;">{{ p.openCount }}</b> open</span></sc-if>
      <sc-if value="{{ p.showDrafting }}" hint-placeholder-val="{{ false }}"><span style="color:var(--accent);">plan in progress</span></sc-if>
      <sc-if value="{{ p.hasProgress }}" hint-placeholder-val="{{ true }}">
        <span style="display:inline-flex; align-items:center; gap:6px;">
          <span style="width:56px; height:4px; border-radius:99px; background:var(--bg-elev2); overflow:hidden; display:inline-block;">
            <span style="display:block; height:100%; width:{{ p.pctWidth }}; background:{{ p.barColor }};"></span>
          </span>
          <span style="color:var(--fg-dim);">{{ p.pctLabel }}</span>
        </span>
      </sc-if>
      <span style="color:var(--fg-dim);">updated {{ p.updatedLabel }}</span>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
    <sc-if value="{{ p.hasFleet }}" hint-placeholder-val="{{ false }}">
      <span style="display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:99px; font-family:var(--mono); font-size:9.5px; color:var(--success); background:color-mix(in oklch, var(--success), transparent 88%); border:1px solid color-mix(in oklch, var(--success), transparent 70%);">
        <span style="width:6px; height:6px; border-radius:99px; background:var(--success); animation:pulse 1.4s ease-in-out infinite;"></span>
        <span>{{ p.fleetRunning }} {{ p.runningWord }} running</span>
        <sc-if value="{{ p.showPaused }}" hint-placeholder-val="{{ false }}"><span style="color:var(--fg-dim);">· {{ p.pausedStr }} paused</span></sc-if>
      </span>
    </sc-if>
    <span style="font-family:var(--mono); font-size:10.5px; white-space:nowrap; color:var(--fg-dim);" style-hover="color:var(--accent);">open planning →</span>
    <div style="position:relative;">
      <button onClick="{{ p.onMenu }}" title="More options" style="width:26px; height:26px; border-radius:var(--r-sm); background:transparent; border:1px solid transparent; color:var(--fg-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;" style-hover="background:var(--bg-elev2); color:var(--fg);"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
      <sc-if value="{{ p.menuOpenFlag }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; right:0; top:calc(100% + 4px); z-index:100; background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:4px 0; min-width:178px; box-shadow:0 6px 22px rgba(0,0,0,.45);">
          <button style="width:100%; padding:7px 14px; border:0; background:transparent; color:var(--fg-muted); font-family:var(--mono); font-size:11px; cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left;" style-hover="background:var(--bg-elev2); color:var(--fg);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>open board on GitHub</button>
          <div style="border-top:1px solid var(--border-soft); margin:4px 0;"></div>
          <button onClick="{{ p.onDelete }}" style="width:100%; padding:7px 14px; border:0; background:transparent; color:var(--danger); font-family:var(--mono); font-size:11px; cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left;" style-hover="background:color-mix(in oklch, var(--danger), transparent 88%);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>delete project</button>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
