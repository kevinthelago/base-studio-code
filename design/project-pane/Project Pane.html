<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>base-studio-code — Planning</title>
<link rel="stylesheet" href="studio.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-0); }
  .studio { display: flex; height: 100vh; font-family: var(--sans); color: var(--tx-hi); -webkit-font-smoothing: antialiased; }
  .studio *, .studio *::before, .studio *::after { box-sizing: border-box; }

  /* ── Claude session (left) ── */
  .session { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-0); }
  .session-head { display: flex; align-items: center; gap: 9px; padding: 13px 18px; border-bottom: 1px solid var(--border-soft); }
  .msgs { flex: 1; overflow: auto; padding: 24px 0; }
  .msg { max-width: 700px; margin: 0 auto 24px; padding: 0 30px; }
  .msg-role { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--tx-lo); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .msg-role.claude { color: var(--accent); }
  .msg-body { font-size: 13.5px; line-height: 1.62; color: var(--tx-mid); }
  .msg-body.user { color: var(--tx-hi); background: var(--bg-2); border: 1px solid var(--border-soft); padding: 13px 15px; border-radius: 11px; }
  .msg-body p { margin: 0 0 11px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body code { font-family: var(--mono); font-size: 11.5px; background: var(--bg-2); border: 1px solid var(--border-soft); padding: 1px 5px; border-radius: 4px; color: var(--tx-hi); }
  .md-h { font-size: 13px; font-weight: 700; color: var(--tx-hi); margin: 4px 0 9px; }
  .md-ul { margin: 0 0 13px; padding-left: 4px; list-style: none; }
  .md-ul li { margin-bottom: 6px; padding-left: 16px; position: relative; }
  .md-ul li::before { content: '•'; color: var(--accent); position: absolute; left: 2px; }
  .md-ul li b { color: var(--tx-hi); font-weight: 600; }
  .code { font-family: var(--mono); font-size: 11.5px; background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 9px; padding: 13px 15px; margin: 0 0 13px; overflow-x: auto; color: var(--tx-mid); white-space: pre; }
  .c-kw { color: var(--violet); } .c-fn { color: var(--blue); } .c-ty { color: var(--green); } .c-var { color: var(--tx-hi); }

  .composer { padding: 14px 18px 20px; }
  .composer-box { max-width: 700px; margin: 0 auto; background: var(--bg-1); border: 1px solid var(--border); border-radius: 13px; padding: 11px 13px; box-shadow: 0 4px 20px rgba(0,0,0,.18); }
  .composer-box textarea { width: 100%; border: none; background: transparent; color: var(--tx-hi); font-family: var(--sans); font-size: 13.5px; resize: none; outline: none; line-height: 1.5; padding: 2px 0; }
  .composer-box textarea::placeholder { color: var(--tx-lo); }
  .composer-foot { display: flex; align-items: center; gap: 7px; margin-top: 9px; }

  /* ── project pane (right) ── */
  .project-pane { width: 384px; flex: 0 0 auto; background: var(--bg-1); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .pp-head { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
  .pp-scroll { flex: 1; overflow: auto; }
  .pgroup-head { position: sticky; top: 0; z-index: 2; background: var(--bg-1); display: flex; align-items: center; gap: 9px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border-soft); transition: background .12s; }
  .pgroup-head:hover { background: var(--bg-2); }

  /* slim scrollbars */
  .msgs::-webkit-scrollbar, .pp-scroll::-webkit-scrollbar { width: 10px; }
  .msgs::-webkit-scrollbar-thumb, .pp-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
  .msgs::-webkit-scrollbar-thumb:hover, .pp-scroll::-webkit-scrollbar-thumb:hover { background: var(--border); border: 3px solid transparent; background-clip: padding-box; }

  @media (max-width: 760px) { .project-pane { width: 320px; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bs-ui.jsx"></script>
<script type="text/babel" src="project-pane.jsx"></script>
</body>
</html>
