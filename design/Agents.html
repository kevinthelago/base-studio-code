<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>base-studio-code · Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg-canvas:oklch(0.13 0.005 250); --bg-panel:oklch(0.17 0.005 250);
  --bg-elev:oklch(0.21 0.006 250); --bg-elev2:oklch(0.26 0.006 250);
  --border:oklch(0.30 0.006 250); --border-soft:oklch(0.24 0.006 250);
  --fg:oklch(0.94 0.004 250); --fg-muted:oklch(0.66 0.008 250); --fg-dim:oklch(0.46 0.008 250);
  --accent:oklch(0.80 0.14 70); --accent-dim:oklch(0.55 0.10 70);
  --success:oklch(0.74 0.13 145); --info:oklch(0.72 0.10 230); --danger:oklch(0.68 0.18 25);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Inter",-apple-system,system-ui,sans-serif;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
}
html,body{margin:0;height:100%;background:#1a1a1c}
body{font-family:var(--sans)}
*{box-sizing:border-box}

/* shell */
.app{width:100%;height:100vh;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);font-size:12px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.titlebar{height:32px;flex:0 0 32px;background:var(--bg-panel);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;padding:0 12px;gap:10px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);user-select:none}
.tl-lights{display:flex;gap:6px;margin-right:6px}
.tl-lights i{width:11px;height:11px;border-radius:50%;display:block}
.tl-lights i:nth-child(1){background:#ed6a5e}.tl-lights i:nth-child(2){background:#f4bf4f}.tl-lights i:nth-child(3){background:#61c454}
.tl-title{flex:1;text-align:center;letter-spacing:.04em}
.tl-meta{display:flex;gap:14px;font-size:10.5px}.tl-meta b{color:var(--fg);font-weight:500}

.shell{flex:1;display:flex;min-height:0}
.rail{width:52px;flex:0 0 52px;background:var(--bg-panel);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent) 0%,oklch(0.62 0.14 50) 100%);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:#1a120a;margin-bottom:10px}
.rail button{width:36px;height:36px;border-radius:7px;border:0;background:transparent;color:var(--fg-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;font-family:var(--mono);font-size:13px}
.rail button:hover{background:var(--bg-elev);color:var(--fg)}
.rail button.active{background:var(--bg-elev);color:var(--accent)}
.rail .spacer{flex:1}
.r-ico{font-family:var(--mono);font-size:12px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-canvas);position:relative}
.statusbar{height:22px;flex:0 0 22px;background:var(--bg-panel);border-top:1px solid var(--border-soft);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted)}
.statusbar .s{display:flex;align-items:center;gap:6px}
.statusbar .s i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.statusbar .s i.warn{background:var(--accent)}
.statusbar .spacer{flex:1}

/* primitives */
.btn{height:28px;padding:0 12px;border-radius:var(--r-md);background:var(--bg-elev);border:1px solid var(--border-soft);color:var(--fg);font-family:var(--mono);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg-elev2)}
.btn.primary{background:var(--accent);color:#1a120a;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in oklch,var(--danger),transparent 70%)}
.input{height:28px;padding:0 10px;border-radius:var(--r-md);background:var(--bg-canvas);border:1px solid var(--border-soft);color:var(--fg);font-family:var(--mono);font-size:11px;width:100%}
.input:focus{outline:none;border-color:var(--accent-dim)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
.hint{font-size:10.5px;color:var(--fg-dim)}
.card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--r-lg)}
.card.pad{padding:16px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:10px;color:var(--fg-muted);background:var(--bg-elev)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-family:var(--mono);font-size:10px;line-height:1.6;background:var(--bg-elev2);color:var(--fg-muted);border:1px solid var(--border-soft)}
.tag.amber{color:var(--accent);border-color:color-mix(in oklch,var(--accent),transparent 75%);background:color-mix(in oklch,var(--accent),transparent 90%)}
.tag.green{color:var(--success);border-color:color-mix(in oklch,var(--success),transparent 75%);background:color-mix(in oklch,var(--success),transparent 90%)}
.tag.info{color:var(--info);border-color:color-mix(in oklch,var(--info),transparent 75%);background:color-mix(in oklch,var(--info),transparent 90%)}
.tag.red{color:var(--danger);border-color:color-mix(in oklch,var(--danger),transparent 75%);background:color-mix(in oklch,var(--danger),transparent 92%)}

/* page + subtabs */
.page{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.subtabs{height:46px;flex:0 0 46px;background:var(--bg-panel);border-bottom:1px solid var(--border-soft);padding:0 22px;display:flex;align-items:end;gap:2px;font-family:var(--mono);font-size:11.5px}
.subtabs .t{padding:0 14px;height:32px;display:flex;align-items:center;gap:8px;border-top-left-radius:6px;border-top-right-radius:6px;border:1px solid transparent;border-bottom:0;color:var(--fg-muted);cursor:pointer}
.subtabs .t.on{background:var(--bg-canvas);color:var(--fg);border-color:var(--border-soft)}
.subtabs .t .count{padding:0 6px;border-radius:3px;background:var(--bg-elev2);color:var(--fg-dim);font-size:10px}
.subtabs .t.on .count{background:color-mix(in oklch,var(--accent),transparent 85%);color:var(--accent)}
.subtabs .t .hint-inline{color:var(--fg-dim);font-size:10px;margin-left:2px}
.subtabs .right{display:flex;align-items:center;gap:10px;margin-left:auto;padding-bottom:6px}

.body{flex:1;overflow:hidden;padding:14px 22px;min-width:0;display:flex;flex-direction:column}

/* section header */
.sec-head{display:flex;align-items:baseline;gap:10px;margin:16px 0 9px}
.sec-head:first-child{margin-top:0}
.sec-head h3{margin:0;font-family:var(--mono);font-size:10.5px;color:var(--fg);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.sec-head .spacer{flex:1}
.sec-head .meta{font-family:var(--mono);font-size:10px;color:var(--fg-dim)}

/* ===== Profiles tab: list + detail ===== */
.prof-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;flex:1;min-height:0}
.prof-list{display:flex;flex-direction:column;min-height:0;padding:0}
.prof-list .head{padding:12px 14px 10px;border-bottom:1px solid var(--border-soft)}
.prof-list .head-row{display:flex;align-items:baseline;gap:8px}
.prof-list .head-row h3{margin:0;font-family:var(--mono);font-size:12px;font-weight:600}
.prof-list .scroll{flex:1;overflow:auto}
.prof-list .list-label{padding:11px 14px 5px;font-family:var(--mono);font-size:9px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.1em}
.prof-row{padding:11px 14px;border-bottom:1px solid var(--border-soft);border-left:2px solid transparent;cursor:pointer}
.prof-row:hover{background:var(--bg-elev)}
.prof-row.on{background:var(--bg-elev);border-left-color:var(--pc,var(--accent));padding-left:12px}
.prof-row .l1{display:flex;align-items:center;gap:8px}
.prof-row .swatch{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.prof-row .pname{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--fg-muted)}
.prof-row.on .pname{color:var(--fg)}
.prof-row .spacer{flex:1}
.prof-row .l2{margin-top:5px;font-family:var(--mono);font-size:9.5px;color:var(--fg-dim);display:flex;gap:8px;flex-wrap:wrap}

.mode-badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-family:var(--mono);font-size:9px;line-height:1.6}
.mode-badge.deny{color:var(--danger);background:color-mix(in oklch,var(--danger),transparent 90%);border:1px solid color-mix(in oklch,var(--danger),transparent 72%)}
.mode-badge.ask{color:var(--accent);background:color-mix(in oklch,var(--accent),transparent 90%);border:1px solid color-mix(in oklch,var(--accent),transparent 72%)}
.mode-badge.allow{color:var(--success);background:color-mix(in oklch,var(--success),transparent 90%);border:1px solid color-mix(in oklch,var(--success),transparent 72%)}

/* application-role distinction */
.prof-row.approle{background:linear-gradient(90deg,color-mix(in oklch,var(--pc,var(--accent)),transparent 93%),transparent 60%)}
.prof-row .sys-pin{font-family:var(--mono);font-size:8.5px;color:var(--fg-dim);display:inline-flex;align-items:center;gap:3px}
.origin-badge{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:99px;font-family:var(--mono);font-size:8.5px;line-height:1.7;border:1px solid var(--border-soft);color:var(--fg-dim);background:var(--bg-elev)}
.origin-badge.approle{color:var(--info);border-color:color-mix(in oklch,var(--info),transparent 72%);background:color-mix(in oklch,var(--info),transparent 90%)}
.origin-badge.gen{color:var(--accent);border-color:color-mix(in oklch,var(--accent),transparent 72%);background:color-mix(in oklch,var(--accent),transparent 90%)}
.sys-banner{padding:10px 14px;border-radius:var(--r-md);display:flex;align-items:center;gap:10px;background:color-mix(in oklch,var(--info),transparent 90%);border:1px solid color-mix(in oklch,var(--info),transparent 72%);font-family:var(--mono);font-size:10.5px;color:var(--fg-muted)}
.sys-banner .ico{width:22px;height:22px;border-radius:6px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#11100e}
.owns-card{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);background:var(--bg-canvas);border:1px solid var(--border-soft)}
.owns-card .surf{width:30px;height:30px;border-radius:7px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--fg-muted);background:var(--bg-elev);border:1px solid var(--border-soft)}

/* detail */
.prof-detail{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto;padding-right:2px}
.pd-head{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--r-lg)}
.pd-head .top{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-soft)}
.pd-head .pswatch{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:#11100e}
.pd-head .pt{flex:1;min-width:0}
.pd-head .pt .nm{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--fg)}
.pd-head .pt .ds{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.pd-stat{padding:10px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--bg-elev)}
.pd-stat .k{font-family:var(--mono);font-size:9.5px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.08em}
.pd-stat .v{font-family:var(--mono);font-size:12px;color:var(--fg);margin-top:3px}

.pd-sec{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:14px 18px}
.pd-sec .h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pd-sec .h h4{margin:0;font-family:var(--mono);font-size:11px;color:var(--fg);text-transform:uppercase;letter-spacing:.08em}
.pd-sec .h .spacer{flex:1}

/* base policy segmented */
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--bg-canvas);border:1px solid var(--border-soft);border-radius:var(--r-md)}
.seg button{height:24px;padding:0 14px;border:1px solid transparent;background:transparent;color:var(--fg-muted);font-family:var(--mono);font-size:10.5px;cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.seg button .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg button.on[data-v="deny"]{color:var(--danger);border-color:color-mix(in oklch,var(--danger),transparent 60%);background:color-mix(in oklch,var(--danger),transparent 88%)}
.seg button.on[data-v="ask"]{color:var(--accent);border-color:var(--accent-dim);background:color-mix(in oklch,var(--accent),transparent 86%)}
.seg button.on[data-v="allow"]{color:var(--success);border-color:color-mix(in oklch,var(--success),transparent 60%);background:color-mix(in oklch,var(--success),transparent 88%)}

/* command chips */
.cmd-chips{display:flex;flex-wrap:wrap;gap:6px}
.cmd-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 9px;border-radius:5px;background:var(--bg-canvas);border:1px solid var(--border-soft);font-family:var(--mono);font-size:11px;color:var(--fg)}
.cmd-chip.locked{color:var(--fg-muted);border-style:dashed}
.cmd-chip .x{color:var(--fg-dim);cursor:pointer}
.cmd-chip .x:hover{color:var(--danger)}
.cmd-add{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:5px;border:1px dashed var(--border);background:transparent;color:var(--fg-muted);font-family:var(--mono);font-size:10.5px;cursor:pointer}
.inherit-note{margin-top:9px;padding:7px 10px;border-radius:5px;background:var(--bg-canvas);border:1px solid var(--border-soft);font-family:var(--mono);font-size:10px;color:var(--fg-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* tools tri-state table */
.tool-table{border:1px solid var(--border-soft);border-radius:var(--r-md);overflow:hidden}
.tool-row{display:grid;grid-template-columns:150px 1fr 220px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--border-soft)}
.tool-row:first-child{border-top:0}
.tool-row:nth-child(even){background:var(--bg-elev)}
.tool-row .tn{font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.tool-row .td{font-size:10.5px;color:var(--fg-muted)}

.tri{display:inline-flex;gap:0;border:1px solid var(--border-soft);border-radius:5px;overflow:hidden}
.tri button{height:22px;padding:0 10px;border:0;background:var(--bg-canvas);color:var(--fg-dim);font-family:var(--mono);font-size:9.5px;cursor:pointer;border-left:1px solid var(--border-soft)}
.tri button:first-child{border-left:0}
.tri button.on[data-v="deny"]{background:color-mix(in oklch,var(--danger),transparent 82%);color:var(--danger)}
.tri button.on[data-v="ask"]{background:color-mix(in oklch,var(--accent),transparent 82%);color:var(--accent)}
.tri button.on[data-v="allow"]{background:color-mix(in oklch,var(--success),transparent 82%);color:var(--success)}

/* path / net lists */
.scope-list{display:flex;flex-direction:column;gap:6px}
.scope-line{display:flex;gap:6px;align-items:center}
.scope-line .gly{width:18px;text-align:center;font-family:var(--mono);font-size:11px}
.scope-line .gly.allow{color:var(--success)}
.scope-line .gly.deny{color:var(--danger)}
.scope-line .x{width:24px;height:24px;border:1px solid var(--border-soft);border-radius:4px;background:transparent;color:var(--fg-dim);cursor:pointer;font-size:12px;flex:0 0 24px}

/* assignments list inside detail */
.assign-mini{display:flex;flex-direction:column;gap:6px}
.assign-mini .row{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:8px 10px;border-radius:5px;background:var(--bg-canvas);border:1px solid var(--border-soft);align-items:center;cursor:pointer}
.assign-mini .row.on{background:var(--bg-elev)}
.assign-mini .check{width:14px;height:14px;border-radius:3px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#1a120a;font-size:10px;font-weight:700}
.assign-mini .row.on .check{background:var(--accent);border-color:var(--accent)}
.assign-mini .cn{font-family:var(--mono);font-size:11px;color:var(--fg)}
.assign-mini .pn{font-family:var(--mono);font-size:10px;color:var(--fg-dim)}

/* ===== Assignments tab ===== */
.asn-grid{display:flex;flex-direction:column;gap:12px}
.console-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--r-lg);overflow:hidden}
.console-card .ch{padding:11px 16px;display:flex;align-items:center;gap:10px;background:var(--bg-elev);border-bottom:1px solid var(--border-soft)}
.console-card .ch .cdot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.console-card .ch .cn{font-family:var(--mono);font-size:13px;color:var(--fg);font-weight:600}
.console-card .ch .repo{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim)}
.console-card .ch .spacer{flex:1}

.pane-row{display:grid;grid-template-columns:170px 200px 1fr auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--border-soft)}
.pane-row:first-of-type{border-top:0}
.pane-row .pident{display:flex;align-items:center;gap:8px}
.pane-row .pdot{width:7px;height:7px;border-radius:50%}
.pane-row .pdot.running{background:var(--success)}
.pane-row .pdot.awaiting{background:var(--accent)}
.pane-row .pdot.idle{background:var(--fg-dim)}
.pane-row .pa{font-family:var(--mono);font-size:12px;color:var(--fg)}
.pane-row .pstat{font-family:var(--mono);font-size:9.5px;color:var(--fg-dim)}

.prof-select{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;background:var(--bg-canvas);border:1px solid var(--border-soft);cursor:pointer;font-family:var(--mono);font-size:11px}
.prof-select .sw{width:9px;height:9px;border-radius:3px}
.prof-select .nm{color:var(--fg)}
.prof-select .cv{color:var(--fg-dim);margin-left:2px}

.resolved{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--fg-dim)}
.resolved .lbl{text-transform:uppercase;letter-spacing:.06em}
.rchip{padding:1px 7px;border-radius:99px;background:var(--bg-elev);border:1px solid var(--border-soft);color:var(--fg-muted);font-size:10px}
.rchip.guar{color:var(--info);border-color:color-mix(in oklch,var(--info),transparent 75%);background:color-mix(in oklch,var(--info),transparent 90%)}

/* ===== Activity tab ===== */
.act-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--r-md)}
.act-toolbar .lbl{font-family:var(--mono);font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.act-toolbar .spacer{flex:1}
.dchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--bg-elev);border:1px solid var(--border-soft);color:var(--fg-muted);font-family:var(--mono);font-size:10.5px;cursor:pointer}
.dchip:hover{background:var(--bg-elev2);color:var(--fg)}
.dchip.on{background:var(--bg-canvas);border-color:var(--accent-dim);color:var(--accent)}
.dchip .dot{width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
.dchip[data-d="allow"] .dot{background:var(--success)}
.dchip[data-d="ask"] .dot{background:var(--accent)}
.dchip[data-d="block"] .dot{background:var(--danger)}

.act-table{border-radius:var(--r-md);border:1px solid var(--border-soft);background:var(--bg-panel);overflow:auto;flex:1;min-height:0}
.act-row{display:grid;grid-template-columns:90px 150px 150px 1fr 110px;gap:12px;padding:10px 14px;align-items:baseline;font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--border-soft);cursor:default}
.act-row:nth-child(even){background:var(--bg-elev)}
.act-row.head{position:sticky;top:0;background:var(--bg-elev2)!important;color:var(--fg-dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px}
.act-row .when{color:var(--fg-muted)}
.act-row .cmd{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-row .dec{display:inline-flex;align-items:center;gap:6px;font-size:10.5px}
.act-row .dec.allow{color:var(--success)}
.act-row .dec.ask{color:var(--accent)}
.act-row .dec.block{color:var(--danger)}
.act-row .prof{display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted)}
.act-row .prof .sw{width:8px;height:8px;border-radius:2px}

/* summary cards */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.summary .card{padding:10px 14px}
.summary .k{font-family:var(--mono);font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em}
.summary .v{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--fg);margin-top:2px}
.summary .v.success{color:var(--success)}.summary .v.accent{color:var(--accent)}.summary .v.danger{color:var(--danger)}
.summary .sub{font-size:10.5px;color:var(--fg-muted);margin-top:1px}

*::-webkit-scrollbar{width:4px;height:4px}
*::-webkit-scrollbar-thumb{background:var(--border)}
*::-webkit-scrollbar-track{background:transparent}
</style>

<script>
/* ============================================================
   Agents — data model
   Permission profiles + console/pane assignments + audit log.

   Grounded in base-studio-code's real model:
   · shell-command allowlists resolve ADDITIVELY across
     global → project → repo scopes (see lib/allowedCommands.ts)
   · gh / git are guaranteed by the backend for every session
   · a profile adds a base policy + tool tri-states + path/net scope
     on top of that command allowlist, and is assigned to panes.
   ============================================================ */

// tri-state values: "deny" | "ask" | "allow"

// ── Application roles ──────────────────────────────────────
// Constantly-present, app-managed singleton sessions. Each OWNS
// its own session (not a console pane) and cannot be deleted or
// unassigned. They are roles in the same permission vocabulary
// as user roles, but bound to a fixed product surface.
const APP_ROLES = [
  {
    id:"sys_planner", name:"Project Planner", color:"oklch(0.7 0.12 290)",
    category:"application",
    desc:"Always-present terminal session that runs project planning — turns pitches into issues, maintains the plan, and declares each project's command allowlist.",
    surface:"Project planning", surfaceGlyph:"P",
    session:"sys/planner", owns:"the planning terminal",
    mode:"ask",
    commands:["gh"],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"allow", write:"allow", bash:"ask", web:"ask", task:"allow" },
    paths:{ allow:[".studio/plan/**","commands.json","docs/plan/**"], deny:["src/**"] },
    net:{ allow:["api.github.com"] },
  },
  {
    id:"sys_librarian", name:"Librarian", color:"oklch(0.72 0.12 175)",
    category:"application",
    desc:"Always-present knowledge-base session. Curates the Knowledge Store — indexes the repo into blocks, maintains tags, and serves pinned context to every other agent.",
    surface:"Knowledge Store", surfaceGlyph:"K",
    session:"sys/librarian", owns:"the knowledge-base session",
    mode:"ask",
    commands:[],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"ask", write:"ask", bash:"deny", web:"allow", task:"allow" },
    paths:{ allow:[".studio/knowledge/**"], deny:["**/*"] },
    net:{ allow:[] },
  },
];

const PROFILES = [
  {
    id:"pf_sandbox", name:"Sandboxed", color:"oklch(0.68 0.18 25)",
    category:"user", origin:"built-in",
    desc:"Default for any new pane. Nothing runs without you. Good for untrusted or first-touch repos.",
    mode:"deny",
    commands:[],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"ask", write:"ask", bash:"deny", web:"deny", task:"deny" },
    paths:{ allow:[], deny:["**/*"] },
    net:{ allow:[] },
    builtin:true,
  },
  {
    id:"pf_review", name:"Read-only review", color:"oklch(0.72 0.10 230)",
    category:"user", origin:"built-in",
    desc:"Inspect, search, and comment — never mutates the tree. The profile @reviewer runs under.",
    mode:"deny",
    commands:[],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"deny", write:"deny", bash:"ask", web:"ask", task:"allow" },
    paths:{ allow:[], deny:["**/*"] },
    net:{ allow:["api.github.com"] },
    builtin:true,
  },
  {
    id:"pf_build", name:"Build & test", color:"oklch(0.78 0.14 70)",
    category:"user", origin:"user-defined",
    desc:"Can edit code and run the project's build/test commands, but asks before anything destructive.",
    mode:"ask",
    commands:["cargo","npm","pnpm","pytest","make","node"],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"allow", write:"allow", bash:"ask", web:"ask", task:"allow" },
    paths:{ allow:["src/**","tests/**","Cargo.toml","package.json"], deny:["**/.env","**/secrets/**",".git/**"] },
    net:{ allow:["crates.io","registry.npmjs.org","pypi.org"] },
    builtin:false,
  },
  {
    id:"pf_docs", name:"Docs writer", color:"oklch(0.7 0.06 90)",
    category:"generated", origin:"generated by Planner",
    desc:"Edits only under docs/ and the wiki. No build tools, no shell. The profile @docs runs under.",
    mode:"ask",
    commands:[],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"allow", write:"allow", bash:"deny", web:"allow", task:"deny" },
    paths:{ allow:["docs/**","*.md","wiki/**"], deny:["src/**","**/*"] },
    net:{ allow:[] },
    builtin:false,
  },
  {
    id:"pf_auto", name:"Autonomous (trusted)", color:"oklch(0.74 0.13 145)",
    category:"user", origin:"user-defined",
    desc:"Runs unattended — auto-approves the full allowlist and most tools. Scope to repos you trust.",
    mode:"allow",
    commands:["cargo","npm","pnpm","pytest","make","node","docker","gh","aws"],
    tools:{ read:"allow", grep:"allow", glob:"allow", edit:"allow", write:"allow", bash:"allow", web:"allow", task:"allow" },
    paths:{ allow:["**/*"], deny:["**/.env","**/secrets/**"] },
    net:{ allow:["*"] },
    builtin:false,
  },
];

// the tools we render in the tri-state table (name + description)
const TOOL_DEFS = [
  ["read",  "Read files inside the repo"],
  ["grep",  "Search file contents (ripgrep)"],
  ["glob",  "Match files by pattern"],
  ["edit",  "Modify existing files"],
  ["write", "Create or overwrite files"],
  ["bash",  "Run arbitrary shell commands"],
  ["web",   "Fetch URLs / browse docs"],
  ["task",  "Spawn a scoped sub-agent"],
];

// Console sessions, each with panes (agents). assignment = pane.profileId.
const CONSOLES = [
  {
    id:"con_orch", name:"orchestrator", repo:"acme/payments", status:"running",
    projectAllow:["cargo","just"],   // project-scope commands from planner's commands.json
    panes:[
      { id:"t1p0", agent:"@scratch",  status:"running",  profileId:"pf_build" },
      { id:"t1p1", agent:"@reviewer", status:"awaiting", profileId:"pf_review" },
      { id:"t1p2", agent:"@docs",     status:"idle",     profileId:"pf_docs" },
      { id:"t1p3", agent:"@github",   status:"running",  profileId:"pf_auto" },
    ],
  },
  {
    id:"con_tunnel", name:"feat/tunnel", repo:"acme/payments", status:"running",
    projectAllow:["cargo","just"],
    repoAllow:["wscat"],             // repo-scope commands
    panes:[
      { id:"t2p0", agent:"@scratch",  status:"running", profileId:"pf_build" },
      { id:"t2p1", agent:"@explore",  status:"idle",    profileId:"pf_sandbox" },
    ],
  },
];

// guaranteed-by-backend commands (always available, can't be removed)
const GUARANTEED = ["gh","git"];

// resolve the effective shell allowlist for a pane:
// guaranteed ∪ profile.commands ∪ console.projectAllow ∪ console.repoAllow
function resolveAllowlist(consoleId, profileId){
  const con = CONSOLES.find(c=>c.id===consoleId);
  const pf = APP_ROLES.concat(PROFILES).find(p=>p.id===profileId);
  const seen = new Set(); const out = [];
  const push = (arr, origin) => (arr||[]).forEach(c=>{
    const k = c.trim().toLowerCase();
    if(k && !seen.has(k)){ seen.add(k); out.push({cmd:k, origin}); }
  });
  push(GUARANTEED, "guaranteed");
  push(pf?.commands, "profile");
  push(con?.projectAllow, "project");
  push(con?.repoAllow, "repo");
  return out;
}

// Audit log — most recent first. [time, consoleName, pane, profileId, kind, target, decision]
// decision: "allow" (auto) | "ask" (prompted→approved) | "block"
const ACTIVITY = [
  ["14:24:02","orchestrator","@scratch","pf_build","cmd","cargo test --workspace","allow"],
  ["14:23:41","orchestrator","@github","pf_auto","cmd","gh pr create --fill","allow"],
  ["14:22:58","orchestrator","@scratch","pf_build","tool","write src/charge.rs","allow"],
  ["14:21:30","orchestrator","@reviewer","pf_review","tool","bash: ls -la","ask"],
  ["14:20:14","feat/tunnel","@explore","pf_sandbox","cmd","npm install","block"],
  ["14:19:02","orchestrator","@docs","pf_docs","tool","write src/app.rs","block"],
  ["14:18:44","orchestrator","@scratch","pf_build","cmd","rm -rf target","ask"],
  ["14:17:21","feat/tunnel","@scratch","pf_build","cmd","cargo build","allow"],
  ["14:16:09","orchestrator","@github","pf_auto","net","api.github.com","allow"],
  ["14:15:55","orchestrator","@reviewer","pf_review","cmd","curl evil.sh","block"],
  ["14:14:30","orchestrator","@scratch","pf_build","tool","edit Cargo.toml","allow"],
  ["14:13:02","feat/tunnel","@explore","pf_sandbox","tool","edit README.md","ask"],
  ["14:12:48","orchestrator","@docs","pf_docs","tool","write docs/api.md","allow"],
  ["14:11:19","orchestrator","@github","pf_auto","cmd","docker compose up -d","allow"],
  ["14:10:02","orchestrator","@scratch","pf_build","cmd","pytest -q","allow"],
  ["14:08:51","feat/tunnel","@scratch","pf_build","cmd","wscat -c ws://localhost:7878","allow"],
  ["14:07:30","orchestrator","@reviewer","pf_review","tool","write notes.md","block"],
  ["14:05:12","orchestrator","@scratch","pf_build","cmd","aws s3 cp","block"],
];

</script>
<script>
/* ============================================================
   Agents — render + interaction
   ============================================================ */

const body = document.getElementById("body");
const tabActions = document.getElementById("tab-actions");

const state = {
  tab: "profiles",
  selectedProfile: "sys_planner",
  actDecision: "all",   // all | allow | ask | block
  actConsole: "all",
};

const MODE_LABEL = { deny:"Deny by default", ask:"Ask each time", allow:"Allow all" };
const pf = id => APP_ROLES.concat(PROFILES).find(p=>p.id===id);
const initialOf = name => name.replace(/[^a-z]/gi,"").slice(0,2).toUpperCase();

function paneCount(profileId){
  let n=0; CONSOLES.forEach(c=>c.panes.forEach(p=>{ if(p.profileId===profileId) n++; }));
  return n;
}
function consoleCount(profileId){
  let n=0; CONSOLES.forEach(c=>{ if(c.panes.some(p=>p.profileId===profileId)) n++; });
  return n;
}

/* ===========================================================
   PROFILES TAB
   =========================================================== */
function renderProfiles(){
  const sel = pf(state.selectedProfile) || PROFILES[0];
  body.innerHTML = `
    <div class="prof-layout">
      <div class="card prof-list">
        <div class="head">
          <div class="head-row">
            <h3>Roles</h3>
            <span class="hint">${APP_ROLES.length} application · ${PROFILES.length} custom</span>
          </div>
          <input class="input" placeholder="filter…" style="margin-top:8px;height:24px;font-size:10.5px"/>
        </div>
        <div class="scroll">
          <div class="list-label">Application · always present</div>
          ${APP_ROLES.map(p=>profRow(p, p.id===sel.id)).join("")}
          <div class="list-label">Custom &amp; generated</div>
          ${PROFILES.map(p=>profRow(p, p.id===sel.id)).join("")}
          <div style="padding:12px 14px">
            <button class="btn ghost" style="width:100%;justify-content:center" data-new-profile>+ new role</button>
          </div>
        </div>
      </div>
      <div class="prof-detail">${profDetail(sel)}</div>
    </div>
  `;
}

function profRow(p, on){
  const isApp = p.category==="application";
  const origin = isApp ? "application"
    : p.category==="generated" ? "generated"
    : (p.origin==="built-in" ? "built-in" : "user-defined");
  const obCls = isApp ? "approle" : p.category==="generated" ? "gen" : "";
  const l2 = isApp
    ? `<span class="sys-pin">◆ owns ${p.session}</span><span>· always on</span>`
    : `<span>${paneCount(p.id)} panes</span><span>· ${p.commands.length} cmds</span>`;
  return `
    <div class="prof-row ${isApp?"approle":""} ${on?"on":""}" data-profile="${p.id}" style="--pc:${p.color}">
      <div class="l1">
        <span class="swatch" style="background:${p.color}"></span>
        <span class="pname">${p.name}</span>
        <span class="spacer"></span>
        <span class="origin-badge ${obCls}">${origin}</span>
      </div>
      <div class="l2">
        ${l2}
        <span class="spacer" style="flex:1"></span>
        <span class="mode-badge ${p.mode}" style="font-size:8.5px">${p.mode}</span>
      </div>
    </div>
  `;
}

function profDetail(p){
  const cmds = p.commands;
  const isApp = p.category==="application";
  const originLabel = isApp ? "application · always on"
    : p.category==="generated" ? "generated"
    : (p.origin==="built-in" ? "built-in" : "user-defined");
  return `
    <div class="pd-head">
      <div class="top">
        <span class="pswatch" style="background:${p.color}">${isApp?"◆":initialOf(p.name)}</span>
        <div class="pt">
          <div class="nm">${p.name} ${isApp?`<span class="origin-badge approle" style="vertical-align:middle">application role</span>`:p.category==="generated"?`<span class="origin-badge gen" style="vertical-align:middle">generated</span>`:""}</div>
          <div class="ds">${p.desc}</div>
        </div>
        ${isApp
          ? `<button class="btn ghost" style="height:26px;font-size:10.5px">open ${p.surfaceGlyph==="P"?"planner":"library"} →</button><button class="btn" style="height:26px;font-size:10.5px">save</button>`
          : `<button class="btn ghost" style="height:26px;font-size:10.5px">duplicate</button><button class="btn" style="height:26px;font-size:10.5px">save</button>`}
      </div>
      ${isApp ? `
        <div style="padding:12px 18px;border-bottom:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px">
          <div class="sys-banner">
            <span class="ico" style="background:${p.color}">◆</span>
            <span><b style="color:var(--fg)">System role.</b> Always present in every workspace — can't be deleted or assigned to a console pane. It runs as its own session.</span>
          </div>
          <div class="owns-card">
            <span class="surf">${p.surfaceGlyph}</span>
            <div style="flex:1">
              <div style="font-family:var(--mono);font-size:12px;color:var(--fg)">Owns ${p.owns}</div>
              <div style="font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-top:2px">surface · ${p.surface} &nbsp;·&nbsp; session · ${p.session}</div>
            </div>
            <span class="tag green" style="font-size:9.5px"><span style="width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:4px"></span>running</span>
          </div>
        </div>` : ""}
      <div class="pd-stat">
        <div><div class="k">base policy</div><div class="v" style="color:${p.mode==='deny'?'var(--danger)':p.mode==='ask'?'var(--accent)':'var(--success)'}">${MODE_LABEL[p.mode]}</div></div>
        <div><div class="k">${isApp?"scope":"assigned"}</div><div class="v">${isApp?"singleton session":paneCount(p.id)+" panes · "+consoleCount(p.id)+" consoles"}</div></div>
        <div><div class="k">commands</div><div class="v">${cmds.length} + ${GUARANTEED.length} guaranteed</div></div>
        <div><div class="k">origin</div><div class="v">${originLabel}</div></div>
      </div>
    </div>

    <!-- base policy -->
    <div class="pd-sec">
      <div class="h"><h4>Base policy</h4><span class="hint">applies to anything not listed below</span></div>
      <div class="seg" data-policy>
        <button data-v="deny"  class="${p.mode==='deny'?'on':''}"><span class="d"></span>Deny</button>
        <button data-v="ask"   class="${p.mode==='ask'?'on':''}"><span class="d"></span>Ask</button>
        <button data-v="allow" class="${p.mode==='allow'?'on':''}"><span class="d"></span>Allow</button>
      </div>
    </div>

    <!-- shell commands -->
    <div class="pd-sec">
      <div class="h">
        <h4>Shell commands</h4>
        <span class="hint">allowlist — runs without a prompt</span>
        <span class="spacer"></span>
        <span class="hint">unions with project + repo lists</span>
      </div>
      <div class="cmd-chips">
        ${GUARANTEED.map(c=>`<span class="cmd-chip locked" title="guaranteed by backend — always available"><span style="color:var(--info)">${c}</span></span>`).join("")}
        ${cmds.map(c=>`<span class="cmd-chip">${c}<span class="x" data-rm-cmd="${c}">×</span></span>`).join("")}
        <button class="cmd-add" data-add-cmd>+ add command</button>
      </div>
      <div class="inherit-note">
        <span style="color:var(--info)">ℹ</span>
        <span><b style="color:var(--fg-muted)">${GUARANTEED.join(", ")}</b> are always available.</span>
        <span>Effective list also unions the console's project &amp; repo allowlists at run time.</span>
      </div>
    </div>

    <!-- tools -->
    <div class="pd-sec">
      <div class="h"><h4>Tools</h4><span class="hint">per-capability — allow runs silently, ask prompts you, deny blocks</span></div>
      <div class="tool-table">
        ${TOOL_DEFS.map(([t,d])=>`
          <div class="tool-row">
            <span class="tn">${t}</span>
            <span class="td">${d}</span>
            <span style="justify-self:end">
              <span class="tri" data-tool="${t}">
                <button data-v="deny"  class="${p.tools[t]==='deny'?'on':''}">deny</button>
                <button data-v="ask"   class="${p.tools[t]==='ask'?'on':''}">ask</button>
                <button data-v="allow" class="${p.tools[t]==='allow'?'on':''}">allow</button>
              </span>
            </span>
          </div>
        `).join("")}
      </div>
    </div>

    <!-- filesystem -->
    <div class="pd-sec">
      <div class="h"><h4>Filesystem scope</h4><span class="hint">globs the agent may write to / is blocked from</span></div>
      <div class="scope-list">
        ${(p.paths.allow.length?p.paths.allow:["(none — read-only)"]).map(g=>`
          <div class="scope-line">
            <span class="gly allow">＋</span>
            <input class="input" value="${g}" ${g.startsWith("(")?"disabled style='opacity:.5'":""}/>
            ${g.startsWith("(")?"":`<button class="x">×</button>`}
          </div>
        `).join("")}
        ${p.paths.deny.map(g=>`
          <div class="scope-line">
            <span class="gly deny">－</span>
            <input class="input" value="${g}"/>
            <button class="x">×</button>
          </div>
        `).join("")}
        <button class="cmd-add" style="margin-top:2px">+ add path rule</button>
      </div>
    </div>

    <!-- network -->
    <div class="pd-sec">
      <div class="h"><h4>Network</h4><span class="hint">hosts the agent may reach (web / fetch tools)</span></div>
      ${p.net.allow.length ? `
        <div class="cmd-chips">
          ${p.net.allow.map(h=>`<span class="cmd-chip">${h==="*"?'<span style="color:var(--accent)">* all hosts</span>':h}<span class="x">×</span></span>`).join("")}
          <button class="cmd-add" data-add-host>+ add host</button>
        </div>` : `
        <div class="inherit-note"><span style="color:var(--fg-dim)">⊘</span> No outbound network. The web / fetch tools are blocked regardless of their tri-state above.</div>
      `}
    </div>

    <!-- assignments / ownership -->
    ${isApp ? `
    <div class="pd-sec">
      <div class="h"><h4>Session</h4><span class="hint">this role is not assignable — it is its own always-on session</span></div>
      <div class="assign-mini">
        <div class="row on" style="cursor:default">
          <div class="check">◆</div>
          <div>
            <span class="cn">${p.session}</span>
            <div class="pn">${p.surface} · launched at startup · 1 of 1</div>
          </div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--success)">always present</div>
        </div>
      </div>
      <div class="inherit-note" style="margin-top:8px">
        <span style="color:var(--info)">ℹ</span>
        <span>Other agents reach ${p.name.split(" ")[0]} through ${p.surfaceGlyph==="P"?"the Plan surface and <b style='color:var(--fg-muted)'>commands.json</b>":"pinned Knowledge blocks"} — not by being assigned this role.</span>
      </div>
    </div>` : `
    <div class="pd-sec">
      <div class="h"><h4>Assigned to</h4><span class="hint">tick the console panes this profile governs</span><span class="spacer"></span><span class="hint">a profile can govern many panes</span></div>
      <div class="assign-mini">
        ${CONSOLES.flatMap(c=>c.panes.map(pane=>{
          const on = pane.profileId===p.id;
          return `
            <div class="row ${on?"on":""}" data-assign="${c.id}|${pane.id}">
              <div class="check">${on?"✓":""}</div>
              <div>
                <span class="cn">${c.name} <span style="color:var(--fg-dim)">›</span> ${pane.agent}</span>
                <div class="pn">${c.repo} · ${pane.id}</div>
              </div>
              <div style="font-family:var(--mono);font-size:10px;color:var(--fg-dim)">${on?"this profile":"→ "+pf(pane.profileId).name}</div>
            </div>
          `;
        })).join("")}
      </div>
    </div>`}

    ${(isApp||p.builtin)?"":`<div style="padding:0 2px 6px"><button class="btn ghost danger" style="height:26px;font-size:10.5px">delete profile</button></div>`}
  `;
}

/* ===========================================================
   ASSIGNMENTS TAB
   =========================================================== */
function renderAssignments(){
  body.innerHTML = `
    <div class="sec-head">
      <h3>Application sessions</h3>
      <span class="hint">always present · one per workspace · role is fixed</span>
      <div class="spacer"></div>
      <span class="meta">${APP_ROLES.length} system roles</span>
    </div>
    <div class="asn-grid" style="margin-bottom:14px">
      <div class="console-card" style="border-color:color-mix(in oklch,var(--info),transparent 78%)">
        <div class="ch" style="background:color-mix(in oklch,var(--info),transparent 92%)">
          <span class="cdot" style="background:var(--info)"></span>
          <span class="cn">system</span>
          <span class="repo">workspace · acme/payments</span>
          <span class="spacer"></span>
          <span class="hint" style="font-family:var(--mono)">launched at startup · not reassignable</span>
        </div>
        ${APP_ROLES.map(appSessionRow).join("")}
      </div>
    </div>

    <div class="sec-head">
      <h3>Console sessions</h3>
      <span class="hint">each pane runs under one profile · the resolved command allowlist shows what actually runs there</span>
      <div class="spacer"></div>
      <span class="meta">${CONSOLES.length} consoles · ${CONSOLES.reduce((a,c)=>a+c.panes.length,0)} panes</span>
    </div>
    <div style="overflow:auto;flex:1;min-height:0">
      <div class="asn-grid">
        ${CONSOLES.map(consoleCard).join("")}
      </div>
    </div>
  `;
}

function appSessionRow(p){
  const resolved = (p.commands.length?p.commands:[]).map(c=>({cmd:c,origin:"profile"}));
  const all = GUARANTEED.map(c=>({cmd:c,origin:"guaranteed"})).concat(resolved);
  return `
    <div class="pane-row">
      <div class="pident">
        <span class="pdot running"></span>
        <span class="pa">${p.surfaceGlyph==="P"?"⌨ planner":"⌬ librarian"}</span>
        <span class="pstat">${p.session}</span>
      </div>
      <div class="prof-select" data-open-pane="${p.id}" style="cursor:pointer">
        <span class="sw" style="background:${p.color}"></span>
        <span class="nm">${p.name}</span>
        <span class="origin-badge approle" style="margin-left:2px">locked</span>
      </div>
      <div class="resolved">
        <span class="lbl">runs:</span>
        ${all.map(r=>`<span class="rchip ${r.origin==='guaranteed'?'guar':''}" title="from ${r.origin}">${r.cmd}</span>`).join("")}
        <span class="rchip" style="border-style:dashed">owns ${p.surface}</span>
      </div>
      <div style="justify-self:end">
        <button class="btn ghost" style="height:24px;font-size:10px" data-open-pane="${p.id}">edit role →</button>
      </div>
    </div>
  `;
}

function consoleCard(c){
  return `
    <div class="console-card">
      <div class="ch">
        <span class="cdot"></span>
        <span class="cn">${c.name}</span>
        <span class="repo">${c.repo}</span>
        <span class="spacer"></span>
        <span class="hint" style="font-family:var(--mono)">project allow: ${(c.projectAllow||[]).join(", ")||"—"}${c.repoAllow?` · repo: ${c.repoAllow.join(", ")}`:""}</span>
      </div>
      ${c.panes.map(pane=>paneRow(c, pane)).join("")}
    </div>
  `;
}

function paneRow(c, pane){
  const p = pf(pane.profileId);
  const resolved = resolveAllowlist(c.id, pane.profileId);
  return `
    <div class="pane-row">
      <div class="pident">
        <span class="pdot ${pane.status}"></span>
        <span class="pa">${pane.agent}</span>
        <span class="pstat">${pane.id}</span>
      </div>
      <div class="prof-select" data-reassign="${c.id}|${pane.id}">
        <span class="sw" style="background:${p.color}"></span>
        <span class="nm">${p.name}</span>
        <span class="mode-badge ${p.mode}" style="margin-left:2px">${p.mode}</span>
        <span class="cv">▾</span>
      </div>
      <div class="resolved">
        <span class="lbl">runs:</span>
        ${resolved.map(r=>`<span class="rchip ${r.origin==='guaranteed'?'guar':''}" title="from ${r.origin}">${r.cmd}</span>`).join("")}
        ${resolved.length===0?`<span class="rchip">— prompt for everything —</span>`:""}
      </div>
      <div style="justify-self:end">
        <button class="btn ghost" style="height:24px;font-size:10px" data-open-pane="${pane.profileId}">edit profile →</button>
      </div>
    </div>
  `;
}

/* ===========================================================
   ACTIVITY TAB
   =========================================================== */
function renderActivity(){
  const rows = ACTIVITY.filter(r=>{
    if(state.actDecision!=="all" && r[6]!==state.actDecision) return false;
    if(state.actConsole!=="all" && r[1]!==state.actConsole) return false;
    return true;
  });
  const allow = ACTIVITY.filter(r=>r[6]==="allow").length;
  const ask   = ACTIVITY.filter(r=>r[6]==="ask").length;
  const block = ACTIVITY.filter(r=>r[6]==="block").length;

  body.innerHTML = `
    <div class="summary">
      <div class="card"><div class="k">decisions · 1h</div><div class="v">${ACTIVITY.length}</div><div class="sub">across ${CONSOLES.length} consoles</div></div>
      <div class="card"><div class="k">auto-allowed</div><div class="v success">${allow}</div><div class="sub">ran without a prompt</div></div>
      <div class="card"><div class="k">prompted</div><div class="v accent">${ask}</div><div class="sub">you confirmed</div></div>
      <div class="card"><div class="k">blocked</div><div class="v danger">${block}</div><div class="sub">policy denied</div></div>
    </div>

    <div class="act-toolbar">
      <span class="lbl">decision</span>
      <div style="display:flex;gap:4px">
        <span class="dchip ${state.actDecision==='all'?'on':''}" data-dec="all"><span class="dot"></span>all</span>
        <span class="dchip ${state.actDecision==='allow'?'on':''}" data-dec="allow" data-d="allow"><span class="dot"></span>allowed <span style="color:var(--fg-dim);margin-left:2px">${allow}</span></span>
        <span class="dchip ${state.actDecision==='ask'?'on':''}" data-dec="ask" data-d="ask"><span class="dot"></span>asked <span style="color:var(--fg-dim);margin-left:2px">${ask}</span></span>
        <span class="dchip ${state.actDecision==='block'?'on':''}" data-dec="block" data-d="block"><span class="dot"></span>blocked <span style="color:var(--fg-dim);margin-left:2px">${block}</span></span>
      </div>
      <span class="lbl" style="margin-left:14px">console</span>
      <select class="input" id="act-console" style="width:200px">
        <option value="all">all consoles</option>
        ${CONSOLES.map(c=>`<option value="${c.name}" ${state.actConsole===c.name?"selected":""}>${c.name}</option>`).join("")}
      </select>
      <div class="spacer"></div>
      <input class="input" placeholder="search command…" style="width:200px"/>
      <button class="btn ghost">export</button>
    </div>

    <div class="act-table">
      <div class="act-row head">
        <span>time</span><span>console › pane</span><span>profile</span><span>command / action</span><span>decision</span>
      </div>
      ${rows.map(([t,con,pane,prof,kind,target,dec])=>{
        const p = pf(prof);
        const sym = dec==="allow"?"✓":dec==="ask"?"◑":"✗";
        const decLabel = dec==="allow"?"allowed":dec==="ask"?"asked":"blocked";
        const kindGlyph = kind==="cmd"?"$":kind==="tool"?"⚒":kind==="net"?"⇡":"·";
        return `
          <div class="act-row">
            <span class="when">${t}</span>
            <span style="color:var(--fg-muted)">${con} <span style="color:var(--fg-dim)">›</span> ${pane}</span>
            <span class="prof"><span class="sw" style="background:${p.color}"></span>${p.name}</span>
            <span class="cmd"><span style="color:var(--fg-dim)">${kindGlyph}</span> ${target}</span>
            <span class="dec ${dec}">${sym} ${decLabel}</span>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

/* ===========================================================
   tab actions (right side of subtab bar)
   =========================================================== */
function renderTabActions(){
  if(state.tab==="profiles"){
    tabActions.innerHTML = `
      <span class="hint" style="font-family:var(--mono)">${APP_ROLES.length} application · ${PROFILES.length} custom roles</span>
      <button class="btn primary" data-new-profile>+ New role</button>`;
  } else if(state.tab==="assignments"){
    tabActions.innerHTML = `
      <span class="hint" style="font-family:var(--mono)">resolved · guaranteed ∪ profile ∪ project ∪ repo</span>
      <button class="btn">apply to all panes…</button>`;
  } else {
    tabActions.innerHTML = `<span class="hint" style="font-family:var(--mono)">live · last 1h</span><button class="btn">pause feed</button>`;
  }
}

/* ===========================================================
   main render + events
   =========================================================== */
function render(){
  document.querySelectorAll(".subtabs .t").forEach(el=>{
    el.classList.toggle("on", el.dataset.tab===state.tab);
  });
  renderTabActions();
  if(state.tab==="profiles") renderProfiles();
  else if(state.tab==="assignments") renderAssignments();
  else renderActivity();
}

document.getElementById("subtabs").addEventListener("click", e=>{
  const t = e.target.closest(".t");
  if(t){ state.tab = t.dataset.tab; render(); }
});

tabActions.addEventListener("click", e=>{
  if(e.target.closest("[data-new-profile]")) alert("New-profile editor would open here.");
});

body.addEventListener("click", e=>{
  // profile select
  const pr = e.target.closest("[data-profile]");
  if(pr){ state.selectedProfile = pr.dataset.profile; render(); return; }

  // base policy
  const pol = e.target.closest("[data-policy] button");
  if(pol){ const p = pf(state.selectedProfile); if(p){ p.mode = pol.dataset.v; render(); } return; }

  // tool tri-state
  const tri = e.target.closest("[data-tool] button");
  if(tri){
    const tool = tri.closest("[data-tool]").dataset.tool;
    const p = pf(state.selectedProfile);
    if(p){ p.tools[tool] = tri.dataset.v; render(); }
    return;
  }

  // remove command chip
  const rm = e.target.closest("[data-rm-cmd]");
  if(rm){
    const p = pf(state.selectedProfile);
    if(p){ p.commands = p.commands.filter(c=>c!==rm.dataset.rmCmd); render(); }
    return;
  }
  // add command (demo prompt)
  if(e.target.closest("[data-add-cmd]")){
    const v = prompt("Allow which command? (e.g. cargo)");
    const p = pf(state.selectedProfile);
    if(v && p){ const k=v.trim().toLowerCase(); if(k && !p.commands.includes(k)) p.commands.push(k); render(); }
    return;
  }

  // assignment toggle from detail
  const asn = e.target.closest("[data-assign]");
  if(asn){
    const [cid,pid] = asn.dataset.assign.split("|");
    const con = CONSOLES.find(c=>c.id===cid);
    const pane = con?.panes.find(p=>p.id===pid);
    if(pane){
      // assign this pane to the selected profile (or revert to sandbox if already this)
      pane.profileId = (pane.profileId===state.selectedProfile) ? "pf_sandbox" : state.selectedProfile;
      render();
    }
    return;
  }

  // reassign cycle (assignments tab) — cycle through profiles
  const re = e.target.closest("[data-reassign]");
  if(re){
    const [cid,pid] = re.dataset.reassign.split("|");
    const con = CONSOLES.find(c=>c.id===cid);
    const pane = con?.panes.find(p=>p.id===pid);
    if(pane){
      const idx = PROFILES.findIndex(p=>p.id===pane.profileId);
      pane.profileId = PROFILES[(idx+1)%PROFILES.length].id;
      render();
    }
    return;
  }

  // open profile from assignments
  const op = e.target.closest("[data-open-pane]");
  if(op){ state.tab="profiles"; state.selectedProfile = op.dataset.openPane; render(); return; }

  // activity decision chip
  const dc = e.target.closest(".dchip");
  if(dc){ state.actDecision = dc.dataset.dec; render(); return; }
});

body.addEventListener("change", e=>{
  if(e.target.id==="act-console"){ state.actConsole = e.target.value; render(); }
});

render();

</script>
</body>
</html>
