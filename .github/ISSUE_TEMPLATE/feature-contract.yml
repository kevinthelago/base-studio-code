name: Feature contract
description: A context-local unit of planned work (Consumes/Produces seams). See docs/planning/issue-contract-template.md.
title: "<imperative title, scoped to one region>"
labels: ["scope:core"]
body:
  - type: markdown
    attributes:
      value: |
        An agent should be able to complete this issue reading **only this issue + the linked contract
        definitions** — never a sibling's implementation. **Consumes** and **Produces** are the seams;
        specify them exhaustively. Internals are guidance, not mandates.
  - type: input
    id: stream
    attributes:
      label: Stream / area
      description: Which stream/layer this belongs to (optional).
      placeholder: tunnel
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: "1"
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 1–3 sentences — what this delivers and why. No implementation detail.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable "done when". One checkbox per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: owns
    attributes:
      label: Ownership boundary
      description: Dirs/globs this owns. Do not modify outside them.
      placeholder: |
        - `src/...`
    validations:
      required: true
  - type: textarea
    id: consumes
    attributes:
      label: Consumes (inbound — frozen; do not read their impl)
      description: Interfaces this calls. One row per contract.
      value: |
        | Name | Defined in | Signature / shape |
        |------|-----------|-------------------|
        | `` | `path:sym` | `` |
  - type: textarea
    id: produces
    attributes:
      label: Produces (outbound — frozen for dependents)
      description: The public surface this must expose. Dependents rely on it exactly.
      value: |
        | Name | Signature / shape | Errors / invariants |
        |------|-------------------|---------------------|
        | `` | `` | |
  - type: textarea
    id: data
    attributes:
      label: Data / schema / events touched
  - type: textarea
    id: skeleton
    attributes:
      label: Skeleton / stubs to implement
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests that prove it + the exact gate command(s).
      value: |
        - Tests:
        - Gate: ``
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: "depends_on / blocks issue refs, e.g. depends_on: #35"
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to plan sections / the contracts source of truth.
