# Verifies the bsc-plan release sidecar (#1090/#1091/#1094) actually builds and bundles on
# macOS (universal) + Linux — the platforms the local Windows checks can't exercise. Manual
# dispatch (a full tauri build is slow); does NOT create a release. A green run proves the
# externalBin check passes with our staging (incl. universal naming) and that bsc-plan lands
# in the bundle next to the app binary.
name: verify-sidecar

on:
  workflow_dispatch:

# Least-privilege: read-only repo access (a build check; creates no release) (#1011).
permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Full bundle. beforeBuildCommand stages the sidecar (scripts/stage-sidecar.mjs); ad-hoc
      # mac signing mirrors release.yml so the arm64 slice signs without a Developer ID cert.
      - name: Build (bundles the sidecar)
        run: npm run tauri -- build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Assert the sidecars are in the bundle
        shell: bash
        run: |
          echo "== staged externalBin =="
          ls -la src-tauri/binaries || true
          missing=0
          for bin in bsc-plan bsc-agent; do
            echo "== searching bundle output for $bin =="
            hits=$(find target -path '*bundle*' \( -name "$bin" -o -name "$bin.exe" \) 2>/dev/null || true)
            echo "$hits"
            if [ -z "$hits" ]; then
              echo "::error::$bin sidecar not found in any bundle output"
              missing=1
            else
              echo "OK: $bin present in the bundle"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "== bundle dirs (diagnostic) =="
            find target -maxdepth 5 -path '*bundle*' -type d 2>/dev/null | head -80
            exit 1
          fi
