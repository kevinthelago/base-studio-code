# Verifies the bsc-plan release sidecar (#1090/#1091/#1094) actually builds and bundles on
# macOS (universal) + Linux — the platforms the local Windows checks can't exercise. Manual
# dispatch (a full tauri build is slow); does NOT create a release. A green run proves the
# externalBin check passes with our staging (incl. universal naming) and that bsc-plan lands
# in the bundle next to the app binary.
name: verify-sidecar

on:
  workflow_dispatch:
  # TEMPORARY (#1094): run on push to this branch to validate now; stripped to
  # dispatch-only before merge (workflow_dispatch is usable once on the default branch).
  push:
    branches: [1094-verify-sidecar-ci]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Full bundle. beforeBuildCommand stages the sidecar (scripts/stage-sidecar.mjs); ad-hoc
      # mac signing mirrors release.yml so the arm64 slice signs without a Developer ID cert.
      - name: Build (bundles the sidecar)
        run: npm run tauri -- build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Assert bsc-plan is in the bundle
        shell: bash
        run: |
          echo "== staged externalBin =="
          ls -la src-tauri/binaries || true
          echo "== searching bundle output for bsc-plan =="
          hits=$(find target -path '*bundle*' \( -name 'bsc-plan' -o -name 'bsc-plan.exe' \) 2>/dev/null || true)
          echo "$hits"
          if [ -z "$hits" ]; then
            echo "::error::bsc-plan sidecar not found in any bundle output"
            echo "== bundle dirs (diagnostic) =="
            find target -maxdepth 5 -path '*bundle*' -type d 2>/dev/null | head -80
            exit 1
          fi
          echo "OK: bsc-plan present in the bundle"
