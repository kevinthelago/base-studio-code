name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022 / MSVC 17.x), NOT windows-latest: the latter floated
          # to a VS 2026 preview (MSVC 14.51) whose STL removed `stdext::checked_array_iterator`,
          # which DuckDB's bundled fmt (libduckdb-sys) still references → the C++ build fails. VS
          # 2022 still has that symbol. Revisit when libduckdb-sys ships an fmt that drops it.
          - platform: windows-2022
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # universal-apple-darwin requires both Apple Silicon and Intel targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # WINDOWS-SIGNING (enable post-procurement, #108): once the Azure Trusted
      # Signing secrets exist and tauri.conf.json has `bundle.windows.signCommand`,
      # uncomment to sign the .exe/.msi during bundling. Kept disabled so unsigned
      # CI builds don't fail for a missing cert. See docs/release-signing.md.
      # - name: Azure Trusted Signing (Windows)
      #   if: matrix.platform == 'windows-2022'
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub OAuth Device Flow (#431): the OAuth App Client ID is a public
          # identifier baked directly into the Rust binary (see GITHUB_CLIENT_ID in
          # src-tauri/src/lib.rs) — no secret/env needed at build time.
          # macOS signing (#119 / #440). We have no Apple Developer ID cert. We must
          # NOT pass APPLE_CERTIFICATE from a (nonexistent) secret: GitHub sets an
          # absent secret to "" — *present but empty* — and the Tauri bundler then
          # runs `security import` on the empty cert and hard-fails, killing the .dmg.
          # So sign AD-HOC ("-") instead: no cert/keychain import, and it signs the
          # arm64 slice — required, a fully unsigned arm64 app won't launch on Apple
          # Silicon at all. The .dmg is unsigned + un-notarized; users clear the
          # quarantine once: `xattr -cr /Applications/base-studio-code.app`.
          # To enable real Developer-ID signing + notarization later, add the six
          # APPLE_* env vars + secrets back (docs/release-signing.md) — they break
          # the build only while empty, so they go in together with the secrets.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'base-studio-code ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows | `.exe` (NSIS installer) or `.msi` |
            | macOS | `.dmg` (universal — Apple Silicon + Intel) |
            | Linux | `.deb` or `.AppImage` |

            See the assets below.

            > **macOS:** the app is currently unsigned/un-notarized. After dragging it
            > to Applications, clear the download quarantine once:
            > `xattr -cr /Applications/base-studio-code.app`
          # Auto-generate the changelog from PRs merged since the previous tag
          # (#121); the Downloads table above is pre-pended to those notes.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
