name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin requires both Apple Silicon and Intel targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # WINDOWS-SIGNING (enable post-procurement, #108): once the Azure Trusted
      # Signing secrets exist and tauri.conf.json has `bundle.windows.signCommand`,
      # uncomment to sign the .exe/.msi during bundling. Kept disabled so unsigned
      # CI builds don't fail for a missing cert. See docs/release-signing.md.
      # - name: Azure Trusted Signing (Windows)
      #   if: matrix.platform == 'windows-latest'
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (#119). tauri-action signs/notarizes only
          # when APPLE_SIGNING_IDENTITY is non-empty, so empty secrets ⇒ an unsigned
          # macOS build instead of a pipeline failure. Populate the six secrets
          # (docs/release-signing.md) to turn signing on with no code change.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'base-studio-code ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows | `.exe` (NSIS installer) or `.msi` |
            | macOS | `.dmg` (universal — Apple Silicon + Intel) |
            | Linux | `.deb` or `.AppImage` |

            See the assets below.
          # Auto-generate the changelog from PRs merged since the previous tag
          # (#121); the Downloads table above is pre-pended to those notes.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
