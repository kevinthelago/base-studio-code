name: CI

# Test ONCE: the PR is the single gate. Branch protection requires "branches up to
# date before merging" (strict), so a PR's run IS the integration test of the exact
# commit that lands — no separate post-merge run on develop/main is needed (#640).
on:
  pull_request:
    # Gate PRs into BOTH integration branches. The dorny/paths-filter `changes` job
    # keeps it cheap (skips frontend/rust jobs when their paths didn't change).
    branches: [develop, main]

# Cancel superseded PR runs: pushing a new commit to a PR cancels its in-flight run.
# Guarded to pull_request so a develop/main run (if ever triggered) is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which parts of the tree changed so the expensive jobs below only run when
  # they need to (~10s). Also picks the Rust OS matrix: the per-OS PTY tests are
  # expensive on macOS, so macOS runs only on PRs into `main` (the release gate);
  # every PR runs Linux. The workflow file is in both path filters, so any CI change
  # re-runs everything. Force a full run with `[ci-all]` in the PR title.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      os: ${{ steps.os.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - name: Pick Rust OS matrix
        id: os
        run: |
          # macOS (~10x the cost) only at the release gate; Linux on every PR. A
          # macOS-only PTY regression then surfaces on the develop->main PR.
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo 'list=["ubuntu-22.04","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["ubuntu-22.04"]' >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (typecheck + lint)
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  rust:
    name: Rust (check + clippy + test)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
    # Per-OS PTY coverage (B-pty-smoke): the process-tree kill is OS-specific
    # (Windows Job Object vs Unix killpg/setsid), so the suite -- which holds the
    # per-OS PtyJob regression tests -- runs on macOS too at the release gate. The
    # OS list comes from the `changes` job (Linux always; +macOS on main PRs).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Single always-run check to require on branch protection. The frontend/rust jobs
  # are conditional (skipped when their paths don't change), and a *skipped* required
  # check can wedge a PR -- so require this aggregate instead. It passes when each
  # needed job succeeded OR was skipped, and fails only on a real failure/cancel (#425).
  gate:
    name: CI gate
    needs: [frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          for r in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required CI job did not pass ($r)"; exit 1
            fi
          done
          echo "CI gate passed"
