name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    # Gate PRs into BOTH integration branches. Previously only `main` PRs ran the
    # build/test/lint here, so PRs into `develop` (every feature + Dependabot PR)
    # merged on CodeQL + audit alone — a broken build only surfaced post-merge on
    # the develop push (#420). The dorny/paths-filter `changes` job keeps it cheap.
    branches: [develop, main]

jobs:
  # Detect which parts of the tree changed so the expensive jobs below only run
  # when they need to. Always runs (it's ~10s). The workflow file itself is in
  # both filters, so any CI change re-runs everything. Force a full run with
  # `[ci-all]` in the PR title or a commit message.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (typecheck + lint)
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
      || contains(github.event.head_commit.message, '[ci-all]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  rust:
    name: Rust (check + clippy + test)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
      || contains(github.event.head_commit.message, '[ci-all]')
    # Per-OS PTY coverage (B-pty-smoke): the process-tree kill is OS-specific
    # (Windows Job Object vs Unix killpg/setsid), so the cargo test suite -- which
    # holds the per-OS PtyJob regression tests -- runs on a Linux AND a macOS
    # runner, not Linux alone. Each test tail-kills its own process group.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Single always-run check to require on branch protection. The frontend/rust
  # jobs are conditional (skipped when their paths don't change), and a *skipped*
  # required check can wedge a PR — so require this aggregate instead. It passes
  # when each needed job succeeded OR was skipped, and fails only on a real
  # failure/cancellation (#425).
  gate:
    name: CI gate
    needs: [frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          for r in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required CI job did not pass ($r)"; exit 1
            fi
          done
          echo "CI gate passed"
