name: CI

on:
  # CI runs on pull requests only (not on every push/merge) -- the same gate
  # (typecheck/lint/clippy/tests) is run locally before each push.
  pull_request:
    branches: [main, develop]

jobs:
  # Detect which parts of the tree changed so the expensive jobs below only run
  # when they need to. Always runs (it's ~10s). The workflow file itself is in
  # both filters, so any CI change re-runs everything. Force a full run with
  # `[ci-all]` in the PR title or a commit message.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (typecheck + lint)
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
      || contains(github.event.head_commit.message, '[ci-all]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  rust:
    name: Rust (check + clippy + test)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || contains(github.event.pull_request.title, '[ci-all]')
      || contains(github.event.head_commit.message, '[ci-all]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
