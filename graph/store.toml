# THE REPO-ROOT MARKER, and the store the build reads. One job each.
#
# Root discovery used to key on `graph/algorithms.json` (`repo_root_by_walk`), which conflated two
# questions that are not the same one: WHERE IS THE REPO, and WHERE IS THE STORE. That conflation is
# why retiring the store breaks root discovery for all 75 materialized crates independently of the
# records — the file has a second job nobody named, and `retire-the-committed-json-record-store`
# measured it as a separate blocker from the records themselves.
#
# This file has exactly one purpose, so nothing can obsolete it by moving somewhere else. It is
# COMMITTED, which is what makes a fresh clone, CI and every nested worktree resolve a root at all.
#
# NEAREST WINS on the walk: each `wt-<short>/` is its own checkout with its own store, and preferring
# the outermost match would compile every worktree against the root checkout's records.

# The store `graph-materialize` and `bsc-emit` compile from, relative to this directory.
#
# NAMED FOR THE PILLAR, not for "records": the runtime side is `~/.base-studio-code/knowledge/graph.db`
# for algorithms and `~/.base-studio-code/components.db` for components, and the committed side should
# say the same word for the same thing. `components.db` HAS landed beside this one (2e29a1095, "the
# committed store is a database, for both pillars"): it is committed, and it holds every one of the
# 311 ids the packaged seed carries, plus 9 more. So the component records DO have a committed home
# now, and the packaged seed is no longer the thing standing in for one — a reader consulting this
# file before touching `src-tauri/data/components/` should know that before deciding anything.
store = "algorithms.db"

# The COMPONENT store, beside it — the second pillar, and the other half of the frontend's dependency
# chain (`the-relationship-derivation-spans-both-record-stores`). Named here for the same reason the
# algorithms store is: a reader that spells `components.db` itself is stale the moment it moves, and
# opening a SQLite path that does not exist CREATES an empty file rather than failing.
#
# Only the relationship derivation reads this key today. `graph_materialize::store_name` scans for a
# line starting `store`, so this key is invisible to it (and to `resolveStorePath`'s `^store` regex) —
# which is what makes adding it safe for the 75 crates that resolve their root through this file.
components = "components.db"
