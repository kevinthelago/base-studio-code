# The seal (#1988). Baked into the rootfs at /etc/wsl.conf, so the agent distro is locked down from
# its first boot — the isolation does NOT depend on the agent runtime cooperating.

[automount]
# No /mnt/c. The Windows drive is simply not mounted, so a session inside the distro has no path to
# your Windows files, your SSH keys, or anything outside this distro. THIS is the cage.
enabled = false
mountFsTab = false

[interop]
# No calling back out to Windows. A Linux process here cannot exec powershell.exe / cmd.exe / any
# Windows binary, closing the interop escape hatch.
enabled = false
appendWindowsPath = false

[user]
# Never root by default.
default = agent

[boot]
systemd = false
