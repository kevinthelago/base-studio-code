<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>css colour harness</title>
    <!-- The REAL stylesheet, so the tokens under test are the ones the app ships. A copied palette
         would pass forever after someone changed a token's colour space, which is the exact failure
         this harness exists to catch. -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
  </head>
  <body>
    <!-- A canvas, because the probe the app passes IS its WebGL canvas — an element with no text of
         its own, whose `color` nothing else reads. -->
    <canvas id="probe" width="8" height="8"></canvas>
    <script type="module" src="/e2e/harness/cssColorHarness.ts"></script>
  </body>
</html>
