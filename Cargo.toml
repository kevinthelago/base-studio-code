[workspace]
members = ["src-tauri", "crates/bsc", "crates/bsc-util", "crates/bsc-sqlite-util", "crates/data", "crates/plandb", "crates/errordb", "crates/skilldb", "crates/llm", "crates/bsc-agent", "crates/mcp-rpc", "crates/research", "crates/compliance", "crates/logs", "crates/bsc-json-store", "crates/bsc-blueprint", "crates/bsc-persona", "crates/bsc-org", "crates/bsc-component", "crates/bsc-ui", "crates/bsc-project", "crates/bsc-files", "crates/bsc-cli-util", "crates/bsc-tunnel", "crates/bsc-todo"]
resolver = "2"

# Strip debug info from DEPENDENCIES in dev/test builds (our own crates keep theirs).
# Bundled DuckDB's `-g` C++ objects + arrow bloat the test-binary link so much that the
# CI linker OOM'd with SIGBUS (#795). `debug = false` also forwards `DEBUG=false` to
# libduckdb-sys's cc build, dropping `-g` from its C++ objects. `test` is listed
# explicitly because its package overrides don't inherit from `dev`.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
