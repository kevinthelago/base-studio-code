# Share the Rust build ACROSS WORKTREES.
#
# This repo is worked by many agents at once, one git worktree each (7 at the time of writing). Every
# worktree has its own `target/`, so each one compiled DuckDB (bundled C++), arrow, tree-sitter and ~8000
# dependency units from scratch. Measured: touching one line in `crates/bsc-graph` cost 58s to rebuild the
# `bsc` binary and 425s to run that crate's tests the FIRST time each profile ran in a tree — against 9s and
# 7s once warm. The expense was never the edit→rebuild loop; it was cold, paid per worktree.
#
# `sccache` caches compiler INVOCATIONS in one shared store (`~/.cache/sccache` by default), keyed on the
# inputs. Two worktrees compiling identical dependency sources hit the same entry, so the second tree's cold
# build is served from cache.
#
# WHY NOT A SHARED `CARGO_TARGET_DIR` — the obvious alternative, and the wrong one here. It broke tauri
# builds before, and it puts every concurrent cargo behind ONE target-dir lock, so seven parallel agents
# serialize on each other. That is the opposite of what this repo needs. sccache keeps the per-tree
# `target/` and shares only the compilation.
#
# REQUIRES `sccache` ON PATH. It lives in `~/.cargo/bin/sccache.exe` (where `cargo install sccache` puts
# it), so any shell that can run cargo can run it. Install: `winget install Mozilla.sccache` or
# `cargo install sccache --locked`. If it is missing, cargo fails loudly with "could not execute process
# sccache" rather than silently building slowly — which is the right failure, but it IS a hard one, so a
# fresh clone needs the install before its first build.
#
# NOTE ON INCREMENTAL: sccache cannot cache incrementally-compiled crates, so the workspace's own crates
# still compile normally — that is deliberate, and costs nothing worth having. Our crates are the small,
# fast part (7-9s warm); the dependencies are the 8000-unit mass this exists to share, and they are never
# built incrementally.
[build]
rustc-wrapper = "sccache"

# PARALLELISM IS CAPPED, AND THE DEFAULT WAS STRICTLY WORSE. Unset, cargo takes one job per LOGICAL
# processor — 16 here, on 8 physical cores. MEASURED, `cargo nextest run --workspace --no-run` after
# touching `bsc-util` (36 of 40 crates rebuild), on 8c/16t / 32 GB with ~16 GB actually free:
#
#     jobs=2    5.47 GB peak    73s
#     jobs=4    8.04 GB peak    55s      <- and 8.13 GB / 54s on a repeat
#     jobs=6   11.64 GB peak    46s
#     jobs=8   13.58 GB peak    46s
#     jobs=16  18.01 GB peak    54s      <- the DEFAULT: no faster than 4, 2.2x the memory
#
# So 16 buys nothing but memory pressure. 6-8 is the fastest for a machine running ONE build, but this
# repo's normal state is many worktree agents at once, and MEMORY is the binding constraint: the gate
# links ~41 test binaries and runs 9 `link.exe` concurrently at the default, one app link alone peaking
# at 2.99 GB. At 4 jobs a gate fits in ~8 GB, so two can coexist in what this box actually has free.
#
# THIS IS A FLEET SETTING, not a single-developer one. Working alone on a bigger box, `--jobs 8` on the
# command line (or CARGO_BUILD_JOBS=8) is the faster choice and overrides this. Raising it here instead
# would be paying for one agent's 15% with everyone else's headroom — and #795 is what running out of
# linker memory looks like in this workspace.
jobs = 4

# THE C++ HALF, which is most of the remaining cost. `duckdb` is vendored with `features = ["bundled"]`,
# so `libduckdb-sys` compiles the DuckDB amalgamation — 280 translation units, a ~614 MB `libduckdb.a` —
# through the `cc` crate. Measured on a warm-cache, wiped-target build: 200s total, `libduckdb-sys` ALONE
# 151s. Before the `[env]` block below, twelve copies of that `.a` existed on one machine, four of them
# byte-identical (same `f6ec0f32a47ea8a4` fingerprint) because every worktree has its own `target/`.
#
# `build.rustc-wrapper` above does NOT reach it. Cargo applies that setting to its own rustc invocations,
# and never exports it as the `RUSTC_WRAPPER` environment variable — so a build script cannot see it.
#
# TWO ROUTES TO sccache WERE TRIED AND BOTH ARE CLOSED ON windows-msvc. Read this before spending a day
# rediscovering them; the evidence is in `cache-the-duckdb-c-build-across-worktrees`.
#
# 1. `[env] RUSTC_WRAPPER = "sccache"`. `cc` really does have an automatic hook — `rustc_wrapper_fallback()`
#    reads that variable and, for a stem of sccache/cachepot/buildcache/kache, wraps the C compiler with it.
#    It is unreachable here. On MSVC, `cc` resolves the tool as
#    `self.env_tool(env).or_else(|| … ).or_else(|| cl_exe.clone())`, and `cl_exe` — from
#    `find_msvc_tools_find_tool` — is always `Some`, so the `None` arm that calls the fallback never runs
#    (cc-1.4.2 `src/lib.rs`). MEASURED: setting the variable changed nothing, `sccache -s` still reported
#    0 C/C++ compile requests after a full 2m22s DuckDB build.
#
# 2. `[env] CXX = "sccache <absolute cl.exe>"`. This one `cc` WOULD honour — `env_tool` splits the value and
#    recognises the wrapper. But taking that branch builds the tool with `Tool::with_args`, whose `env` is
#    `Vec::new()`, while the MSVC environment (INCLUDE, LIB, PATH) is attached ONLY by
#    `Tool::from_find_msvc_tools`. So overriding `CXX` silently drops the header/library search paths, and
#    the build then depends on the shell already being a Developer Command Prompt. Reproducing that env in
#    config would pin an MSVC toolchain version into a checked-in file and apply it to every cargo
#    invocation, not just this one.
#
# What is left is (a) linking a prebuilt libduckdb via DUCKDB_LIB_DIR/DUCKDB_INCLUDE_DIR — which changes
# what the installer ships, so it is a decision rather than a patch — and (b) not paying for `-O2` on a
# dependency nobody debugs, which is the override in the root `Cargo.toml` and is portable.

# Cross-compiling the sensor for the monitor Pi (aarch64). Recorded here rather
# than left as an environment variable a person has to know: `bsc deploy` ships
# an aarch64 artifact to that device, and a deploy path that only works when you
# remember an incantation is not a deploy path.
#   apt-get install gcc-aarch64-linux-gnu
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
